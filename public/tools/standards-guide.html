<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليل معايير المراجعة والتأكيد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f9; --panel:#ffffff; --text:#1c2534; --muted:#67728a; --border:#e1e6ef;
  --primary:#1a3a5c; --primary-l:#e7edf6; --accent:#b8862c; --accent-l:#f7ecd8;
  --shadow:0 2px 10px rgba(20,35,60,.06); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hdr{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:18px 26px;box-shadow:var(--shadow)}
.hdr-inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.hdr h1{font-size:19px;font-weight:900;display:flex;align-items:center;gap:8px}
.hdr .sub{font-size:12px;opacity:.75;margin-top:2px}
.search-wrap{flex:1;min-width:220px;position:relative}
.search-wrap input{
  width:100%;padding:11px 40px 11px 14px;border-radius:10px;border:none;
  font-family:inherit;font-size:14px;background:rgba(255,255,255,.12);color:#fff;
}
.search-wrap input::placeholder{color:rgba(255,255,255,.65)}
.search-wrap input:focus{outline:2px solid var(--accent);background:rgba(255,255,255,.18)}
.search-wrap .ic{position:absolute;right:13px;top:50%;transform:translateY(-50%);opacity:.7;pointer-events:none}
.count-pill{background:rgba(255,255,255,.14);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}

.wrap{max-width:1280px;margin:0 auto;padding:20px 26px 60px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{
  padding:8px 16px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;
  border:1.5px solid var(--border);background:var(--panel);color:var(--muted);transition:.15s;
}
.chip:hover{border-color:var(--primary);color:var(--primary)}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.cat-section{margin-bottom:28px}
.cat-title{
  font-size:14px;font-weight:800;color:var(--primary);margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.cat-title .n{background:var(--primary-l);color:var(--primary);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;
}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code-badge{
  background:var(--accent-l);color:var(--accent);font-weight:900;font-size:12.5px;
  padding:4px 12px;border-radius:8px;white-space:nowrap;
}
.pages{font-size:11px;color:var(--muted);white-space:nowrap}
.card-title{font-size:13.5px;font-weight:700;line-height:1.6;color:var(--text);flex:1}
.card-actions{display:flex;gap:8px;margin-top:2px}
.btn{
  flex:1;text-align:center;padding:9px 10px;border-radius:9px;font-size:12.5px;font-weight:700;
  cursor:pointer;border:none;font-family:inherit;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:5px;
}
.btn-view{background:var(--primary);color:#fff}
.btn-view:hover{background:#132c47}
.btn-dl{background:var(--primary-l);color:var(--primary);border:1.5px solid var(--border)}
.btn-dl:hover{border-color:var(--primary)}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:10px}

.footer{
  text-align:center;padding:22px;color:var(--muted);font-size:11.5px;
  border-top:1px solid var(--border);margin-top:20px;
}

#no-access{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:999}

@media(max-width:640px){
  .hdr{padding:14px 16px}
  .wrap{padding:16px 16px 40px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

let activeCat = '';
let query = '';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fileUrl(id){ return '/api/standards-files/' + id + '.pdf'; }

function renderChips(){
  const chips = document.getElementById('chips');
  const allChip = `<div class="chip${activeCat===''?' active':''}" data-cat="">الكل (${STANDARDS.length})</div>`;
  const rest = STANDARDS_CATS.map(c=>{
    const n = STANDARDS.filter(s=>s.cat===c).length;
    return `<div class="chip${activeCat===c?' active':''}" data-cat="${c}">${STANDARDS_CAT_LABELS[c]} (${n})</div>`;
  }).join('');
  chips.innerHTML = allChip + rest;
  chips.querySelectorAll('.chip').forEach(el=>{
    el.onclick = ()=>{ activeCat = el.dataset.cat; render(); };
  });
}

function matches(s){
  if(activeCat && s.cat!==activeCat) return false;
  if(!query) return true;
  const q = query.toLowerCase();
  return s.code.toLowerCase().includes(q) || s.title.toLowerCase().includes(q);
}

function card(s){
  return `<div class="card">
    <div class="card-top">
      <span class="code-badge">${esc(s.code)}</span>
      <span class="pages">${s.pages} صفحة</span>
    </div>
    <div class="card-title">${esc(s.title)}</div>
    <div class="card-actions">
      <a class="btn btn-view" href="${fileUrl(s.id)}" target="_blank" rel="noopener">🔍 عرض</a>
      <a class="btn btn-dl" href="${fileUrl(s.id)}" download>⬇ تنزيل</a>
    </div>
  </div>`;
}

function render(){
  renderChips();
  const results = document.getElementById('results');
  const filtered = STANDARDS.filter(matches);
  document.getElementById('countPill').textContent = filtered.length + ' مستنداً';

  if(!filtered.length){
    results.innerHTML = `<div class="empty"><div class="ei">🔍</div>لا توجد نتائج مطابقة للبحث</div>`;
    return;
  }

  if(activeCat || query){
    results.innerHTML = `<div class="grid">${filtered.map(card).join('')}</div>`;
    return;
  }

  // Grouped view: one section per category, in a fixed sensible order
  results.innerHTML = STANDARDS_CATS.map(c=>{
    const items = STANDARDS.filter(s=>s.cat===c);
    if(!items.length) return '';
    return `<div class="cat-section">
      <div class="cat-title">${STANDARDS_CAT_LABELS[c]} <span class="n">${items.length}</span></div>
      <div class="grid">${items.map(card).join('')}</div>
    </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', (e)=>{
  query = e.target.value.trim();
  render();
});

render();
</script>
