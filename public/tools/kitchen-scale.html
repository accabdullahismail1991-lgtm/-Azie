<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منصة عربية لحساب تكلفة الأطباق وهندسة المنيو ومحاكاة أثر تغيّر الأسعار وقنوات التوصيل ونقطة التعادل للمطاعم.">
<meta name="theme-color" content="#0D131E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E9A23B'/%3E%3Cpath d='M16 6v20M9 10h14M9 10l-4 9a4 4 0 0 0 8 0zM23 10l-4 9a4 4 0 0 0 8 0zM12 26h8' fill='none' stroke='%231B1305' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>ميزان المطبخ · التكلفة وهندسة المنيو</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: right-hand rail (RTL) + working canvas; summary tiles → alerts → charts → detail tables */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#0D131E; --surface:#141C2A; --surface-2:#1A2435; --line:#263249; --line-soft:#1F2a3d;
  --fg:#E7EBF2; --muted:#8F9CB4; --accent:#E9A23B; --accent-ink:#1B1305; --accent-soft:rgba(233,162,59,.14);
  --good:#41C283; --info:#4FA6DC; --violet:#A98BF5; --bad:#EA6352;
  --good-soft:rgba(65,194,131,.14); --info-soft:rgba(79,166,220,.15); --violet-soft:rgba(169,139,245,.15); --bad-soft:rgba(234,99,82,.15);
  --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.25);
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-display:"Readex Pro", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --r:12px; --r-sm:8px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --line:#D8DEE8; --line-soft:#E6EAF1;
  --fg:#152034; --muted:#5A6780; --accent:#B06D12; --accent-ink:#FFFFFF; --accent-soft:rgba(176,109,18,.10);
  --good:#1C8752; --info:#1E6DA5; --violet:#6A4BD0; --bad:#C23E2C;
  --good-soft:rgba(28,135,82,.10); --info-soft:rgba(30,109,165,.10); --violet-soft:rgba(106,75,208,.10); --bad-soft:rgba(194,62,44,.10);
  --shadow:0 1px 2px rgba(20,32,52,.06), 0 6px 18px rgba(20,32,52,.06); color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#EEF1F6; --line:#D8DEE8; --line-soft:#E6EAF1;
  --fg:#152034; --muted:#5A6780; --accent:#B06D12; --accent-ink:#FFFFFF; --accent-soft:rgba(176,109,18,.10);
  --good:#1C8752; --info:#1E6DA5; --violet:#6A4BD0; --bad:#C23E2C;
  --good-soft:rgba(28,135,82,.10); --info-soft:rgba(30,109,165,.10); --violet-soft:rgba(106,75,208,.10); --bad-soft:rgba(194,62,44,.10);
  --shadow:0 1px 2px rgba(20,32,52,.06), 0 6px 18px rgba(20,32,52,.06); color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
#main:focus{outline:none}
.num,td.n,.tab{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);gap:20px;max-width:1360px;margin-inline:auto;align-items:start}
/* ===== Rail ===== */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 6px 2px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.2}
.brand-sub{color:var(--muted);font-size:12px}
.nav{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);color:var(--muted);text-decoration:none;font-weight:500;white-space:nowrap;transition:background .15s,color .15s}
.nav a svg{flex:none;opacity:.9}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset -3px 0 0 var(--accent)}
.rail-foot{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.rail-foot strong{color:var(--fg);font-weight:600}
/* ===== Header ===== */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font-family:var(--font-display);font-size:clamp(20px,2.4vw,26px);margin:0;font-weight:700;text-wrap:balance;line-height:1.3}
.topbar .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line-soft);color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;cursor:pointer;transition:background .15s,border-color .15s;text-decoration:none;touch-action:manipulation}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--surface-2)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.icon-btn{width:38px;padding:0}
/* ===== Notices ===== */
.notice{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface)}
.notice svg{flex:none;margin-top:3px}
.notice.warn{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.notice.warn svg{color:var(--accent)}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.notice.bad svg{color:var(--bad)}
.notice.info svg{color:var(--info)}
.notice b{font-weight:600}
.notice p{margin:0;color:var(--muted);font-size:13px}
.notice .grow{flex:1;min-width:0}
/* ===== Panels / tiles ===== */
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel h2{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.panel .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.panel-head .hint{margin:0}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{color:var(--muted);font-size:13px;letter-spacing:.01em}
.tile .val{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .val.sm{font-size:18px}
.tile .meta{font-size:12.5px;color:var(--muted)}
.tile.accent .val{color:var(--accent)}
.tile.good .val{color:var(--good)}
.tile.bad .val{color:var(--bad)}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
/* ===== Tables ===== */
.table-wrap{position:relative;overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.dish-name{font-weight:600}
.sub-txt{color:var(--muted);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.star{background:var(--good-soft);color:var(--good)}
.pill.plow{background:var(--info-soft);color:var(--info)}
.pill.puzzle{background:var(--violet-soft);color:var(--violet)}
.pill.dog{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.pill.warn{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.up{color:var(--bad)} .down{color:var(--good)}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px;font-family:var(--font-display)}
/* ===== Charts ===== */
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart text{fill:var(--muted);font-family:var(--font-body);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(80px,140px) minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.bar-row .bn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:999px}
.bar-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.bar-row .bv{text-align:end;font-variant-numeric:tabular-nums;color:var(--fg);font-weight:600}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center}
.donut-wrap svg{width:170px;height:170px;flex:none}
.kv{display:flex;flex-direction:column;gap:10px;min-width:160px}
.kv div{display:flex;justify-content:space-between;gap:16px;font-size:14px}
.kv span{color:var(--muted)}
.kv b{font-variant-numeric:tabular-nums}
/* ===== Opportunities ===== */
.opps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opp{border:1px solid var(--line-soft);border-radius:var(--r);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0;border-top:3px solid var(--c, var(--accent))}
.opp h3{margin:0;font-size:14.5px;font-family:var(--font-display);font-weight:600;display:flex;gap:8px;align-items:center}
.opp ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.opp li{display:flex;justify-content:space-between;gap:10px}
.opp li span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.opp .none{color:var(--muted);font-size:13px}
/* ===== Forms / dialogs ===== */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg);padding:0;width:min(640px, calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 24px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(5,9,16,.6)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dlg header{padding:16px 18px;border-bottom:1px solid var(--line-soft);display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg header h3{margin:0;font-family:var(--font-display);font-size:17px}
.dlg .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.dlg footer .end{display:flex;gap:8px;margin-inline-start:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.field .help{font-size:12px;color:var(--muted)}
.input,select.input{width:100%;min-height:40px;padding:8px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.input[type=number]{font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 110px 86px 36px;gap:8px;align-items:center}
.line .cost{font-size:13px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;background:var(--surface-2);border-radius:var(--r-sm);padding:12px}
.calc div{display:flex;flex-direction:column;gap:2px}
.calc span{font-size:12px;color:var(--muted)}
.calc b{font-family:var(--font-display);font-size:17px;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.stars{display:inline-flex;gap:2px;direction:ltr}
.stars button{background:none;border:0;padding:4px;cursor:pointer;color:var(--line);line-height:0;border-radius:6px}
.stars button:hover,.stars button.on{color:var(--accent)}
.stars button:hover ~ button{color:var(--line)}
.stars:hover button{color:var(--accent)}
.stars button:hover ~ button{color:var(--line)}
.toast{position:fixed;inset-inline:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:50}
.toast div{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
.toast.show div{opacity:1;transform:none}
.be-meter{position:relative;height:18px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.be-meter .fill{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px}
.be-meter .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--fg);border-radius:2px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-btn{min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:500;cursor:pointer;touch-action:manipulation}
.seg-btn:hover{color:var(--fg)}
.seg-btn[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent);color:var(--accent);font-weight:600}
.input.sm{min-height:34px;padding:4px 8px;font-size:14px;width:96px;max-width:100%}
.arrow{color:var(--muted);margin-inline:3px;font-weight:400}
.sim-ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:center;padding:28px;border-radius:18px;background:radial-gradient(120% 140% at 100% 0%, var(--accent-soft), transparent 60%), var(--surface);border:1px solid var(--line-soft)}
.eyebrow{display:inline-block;font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.01em;margin-bottom:6px}
.hero h1{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);line-height:1.2;margin:0 0 12px;text-wrap:balance}
.hero p{color:var(--muted);font-size:16px;max-width:60ch;margin:0}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn.lg{min-height:46px;padding:10px 20px;font-size:16px}
.hero-card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hc-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.hc-row span{color:var(--muted);font-size:14px}
.hc-row b{font-family:var(--font-display);font-size:22px;font-variant-numeric:tabular-nums}
.hc-pills{display:flex;flex-wrap:wrap;gap:6px}
.hc-empty{display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.hc-empty b{color:var(--fg);font-family:var(--font-display);font-size:18px}
.sec-h{font-family:var(--font-display);font-size:20px;margin:6px 0 12px}
.feats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.feat{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.feat-i{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.feat h3{margin:4px 0 0;font-size:15.5px;font-family:var(--font-display)}
.feat p{margin:0;color:var(--muted);font-size:14px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;counter-reset:st}
.steps li{counter-increment:st;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px}
.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-weight:700;font-family:var(--font-display);margin-bottom:6px}
.steps span{color:var(--muted);font-size:13.5px}
.cta-band{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
@media (max-width:1080px){ .feats{grid-template-columns:repeat(2,minmax(0,1fr))} .steps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){ .hero{grid-template-columns:minmax(0,1fr);padding:20px} }
@media (max-width:520px){ .feats,.steps{grid-template-columns:minmax(0,1fr)} }
.muted{color:var(--muted)}
.mt0{margin-top:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skeleton{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width: 1080px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-3-2{grid-template-columns:minmax(0,1fr)} }
@media (max-width: 860px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-block:-8px 0;gap:8px}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;overflow-x:auto;scrollbar-width:none;padding:6px}
  .nav::-webkit-scrollbar{display:none}

<script>
// مزامنة قاعدة البيانات — تعمل بشفافية فوق localStorage الأصلي للتطبيق
// (نفس أسلوب المزامنة المستخدم في بقية أدوات المنصة: نحمّل أي مفتاح
// localStorage يبدأ بالبادئة "mizan-" من الخادم قبل تشغيل سكربت التطبيق،
// ثم نرسل نسخة محدَّثة للخادم كلما تغيّر أي مفتاح منها).
(function(){
  var APP_ID = 'kitchen-scale';
  var PREFIX = 'mizan-';

  try{
    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/data/' + APP_ID, false);
    xhr.send(null);
    if(xhr.status === 200){
      var body = JSON.parse(xhr.responseText || '{}');
      var blob = body && body.data;
      if(blob && typeof blob === 'object'){
        Object.keys(blob).forEach(function(k){
          if(k.indexOf(PREFIX) === 0 && typeof blob[k] === 'string') window.localStorage.setItem(k, blob[k]);
        });
      }
    }
  }catch(e){ console.error('تعذّر تحميل بيانات ميزان المطبخ من الخادم', e); }

  function pushSnapshot(){
    var out = {};
    for(var i=0;i<window.localStorage.length;i++){
      var k = window.localStorage.key(i);
      if(k && k.indexOf(PREFIX) === 0) out[k] = window.localStorage.getItem(k);
    }
    AzieData.debouncedSave(APP_ID, function(){ return out; }, 600);
  }
  var origSetItem = Storage.prototype.setItem;
  var origRemoveItem = Storage.prototype.removeItem;
  Storage.prototype.setItem = function(key, value){
    origSetItem.apply(this, arguments);
    if(this === window.localStorage && typeof key === 'string' && key.indexOf(PREFIX) === 0) pushSnapshot();
  };
  Storage.prototype.removeItem = function(key){
    origRemoveItem.apply(this, arguments);
    if(this === window.localStorage && typeof key === 'string' && key.indexOf(PREFIX) === 0) pushSnapshot();
  };
})();
</script>

/* ---------- Calculations ---------- */
function ingPrice(g){ const h=g.history||[]; return h.length? +h[h.length-1].p : 0; }
function ingCostPerUnit(g, ovPrice){ const y = Math.max(1, +g.yield||100)/100; return (ovPrice!=null? ovPrice : ingPrice(g))/y; }
function priceChange30(g){
  const h = (g.history||[]).slice().sort((a,b)=>a.d<b.d?-1:1); if(h.length<2) return null;
  const cutoff = ago(30); const cur = +h[h.length-1].p;
  const lastChange = h[h.length-1].d; if(lastChange < cutoff) return null;
  let base = h[0]; for(const e of h){ if(e.d<=cutoff) base=e; }
  if(base===h[h.length-1]) base = h[h.length-2];
  const b = +base.p; if(!b) return null;
  return {from:b, to:cur, ch:(cur-b)/b, date:lastChange};
}
function dishCost(d, ov){ return (d.lines||[]).reduce((s,l)=>{ const g=S.ing[l.i]; return s + (g? ingCostPerUnit(g, ov&&ov[l.i]!=null? ov[l.i] : null)*(+l.q||0) : 0); },0); }
const FX_PER = {m:{ar:"شهري",div:1}, q:{ar:"ربع سنوي",div:3}, y:{ar:"سنوي",div:12}};
const FX_DEFAULT = [["الإيجار"],["الرواتب والأجور"],["الكهرباء والماء والغاز"],["الاتصالات والإنترنت"],["الصيانة"],["التسويق والإعلان"],["أنظمة نقاط البيع والاشتراكات"],["التأمين"],["الرخص والرسوم الحكومية"]];
function fixedItems(){
  const st = S.settings;
  if(Array.isArray(st.fixedItems)) return st.fixedItems;
  const f = st.fixed||{}, map=[["rent","الإيجار"],["salaries","الرواتب والأجور"],["utilities","الكهرباء والماء والاتصالات"],["other","تكاليف ثابتة أخرى"]];
  const items = map.filter(([k])=>+f[k]).map(([k,n])=>({id:k, name:n, amount:+f[k], per:"m"}));
  return items.length? items : [];
}
const fxMonthly = it => (+it.amount||0)/((FX_PER[it.per]||FX_PER.m).div);
const fixedTotal = () => fixedItems().reduce((t,it)=>t+fxMonthly(it),0);
function netPrice(d){ const p=+d.price||0; return S.settings.vatIncl ? p/1.15 : p; }

const DEFAULT_CHANNELS = [
  {id:"dinein", name:"الفروع (صالة وسفري)", comm:0, markup:0, pack:0},

const chans = () => (Array.isArray(S.settings.channels) && S.settings.channels.length)? S.settings.channels : [DEFAULT_CHANNELS[0]];
const isApp = c => c.id!=="dinein";
function chSold(d, id){ if(d.ch && typeof d.ch==="object") return Math.max(0, +d.ch[id]||0); return id==="dinein"? Math.max(0, +d.sold||0) : 0; }
function totalSoldOf(d){ return chans().reduce((s,c)=>s+chSold(d,c.id),0); }
function chUnit(d, c, cost){
  const gross = (+d.price||0)*(1+(+c.markup||0)/100);
  const net = S.settings.vatIncl? gross/1.15 : gross;
  const comm = net*(+c.comm||0)/100, pack = +c.pack||0;
  return {gross, net, comm, pack, cm: net-comm-cost-pack};
}
function analyze(opts={}){
  const target = (+S.settings.target||30)/100;
  const all = chans();
  let sel = (!opts.ch || opts.ch==="all")? all : all.filter(c=>c.id===opts.ch);
  if(!sel.length) sel = all;
  const ov = opts.ov || null;
  const rows = Object.entries(S.dish).map(([id,d])=>{
    const cost = dishCost(d, ov);
    let sold=0, revenue=0, comm=0, totalCm=0, pack=0; const byCh={};
    sel.forEach(c=>{ const u=chUnit(d,c,cost), s=chSold(d,c.id); byCh[c.id]={...u, sold:s}; sold+=s; revenue+=u.net*s; comm+=u.comm*s; totalCm+=u.cm*s; pack+=u.pack*s; });
    const f = byCh[sel[0].id];
    const net = sold? revenue/sold : f.net, cm = sold? totalCm/sold : f.cm;
    const loseIn = sel.filter(c=>byCh[c.id].cm<=0).map(c=>c.name);
    return {id, d, name:d.name, cost, price: sel.length===1? f.gross : (+d.price||0), net, sold, cm, cmPct: net? cm/net : 0, fc: net? cost/net : 0,
      revenue, totalCm, totalCost: cost*sold, comm, pack, byCh, loseIn,
      rating: d.rc? d.rs/d.rc : null, rc:d.rc||0,
      suggested: cost/target * (S.settings.vatIncl?1.15:1)};
  });
  const N = rows.length;
  const sum = k => rows.reduce((s,r)=>s+r[k],0);
  const totalSold = sum("sold"), totalRev = sum("revenue"), totalCm = sum("totalCm"), totalCost = sum("totalCost"), totalComm = sum("comm"), totalPack = sum("pack");
  const avgCmWeighted = totalSold? totalCm/totalSold : 0;
  const avgCmSimple = N? rows.reduce((s,r)=>s+r.cm,0)/N : 0;
  const avgCm = S.settings.avgMethod==="simple" ? avgCmSimple : avgCmWeighted;
  const popThreshold = N? 0.7/N : 0;
  rows.forEach(r=>{
    r.mix = totalSold? r.sold/totalSold : 0;
    r.revShare = totalRev? r.revenue/totalRev : 0;
    r.cmShare = totalCm? r.totalCm/totalCm : 0;
    const hiPop = r.mix >= popThreshold, hiCm = r.cm >= avgCm;
    r.cls = hiPop&&hiCm? "star" : hiPop? "plow" : hiCm? "puzzle" : "dog";
    r.losing = r.loseIn.length>0;
    r.review = !r.losing && r.fc > target + 0.0001;
  });
  const fcActual = totalRev? totalCost/totalRev : 0;
  return {rows, N, sel, totalSold, totalRev, totalCm, totalCost, totalComm, totalPack, avgCm, avgCmWeighted, avgCmSimple, popThreshold, fcActual, target};
}

    </div></div></div>`;
}
function priceAlerts(){
  return Object.entries(S.ing).map(([id,g])=>({id,g,c:priceChange30(g)})).filter(x=>x.c && x.c.ch>0.10);
}
function vDashboard(){
  const a = analyze();
  let h = header("نظام إدارة التكلفة وهندسة قائمة الطعام") + banners();
  if(!a.N) return h + emptyState();
  const alerts = priceAlerts();
  if(alerts.length){
    h += `<div class="notice warn">${ico("trend")}<div class="grow"><b>ارتفاع أسعار مواد</b><p>${alerts.length} ${alerts.length===1?"مادة ارتفع سعرها":"مواد ارتفعت أسعارها"} أكثر من 10% خلال 30 يوماً: ${alerts.map(x=>`${esc(x.g.name)} (<span class="num" dir="ltr">+${nf1.format(x.c.ch*100)}%</span>)`).join("، ")}</p></div><a class="btn sm" href="#ingredients">مراجعة</a></div>`;
  }
  const rated = a.rows.filter(r=>r.rc);
  const totRc = rated.reduce((s,r)=>s+r.rc,0);
  const avgRating = totRc? rated.reduce((s,r)=>s+r.d.rs,0)/totRc : null;
  const best = a.rows.slice().sort((x,y)=>y.cm-x.cm)[0];
  const top = a.rows.slice().sort((x,y)=>y.sold-x.sold)[0];
  const losing = a.rows.filter(r=>r.losing), review = a.rows.filter(r=>r.review);
  const fcCls = a.fcActual > a.target ? "bad" : "good";
  h += `<section class="tiles" aria-label="المؤشرات الرئيسية">
    <div class="tile"><span class="lbl">عدد الأطباق</span><span class="val">${a.N}</span><span class="meta">في قائمة الطعام</span></div>
    <div class="tile"><span class="lbl">المواد الأولية</span><span class="val">${Object.keys(S.ing).length}</span><span class="meta">${alerts.length? alerts.length+" بتنبيه سعر":"لا تنبيهات سعر"}</span></div>
    <div class="tile ${fcCls}"><span class="lbl">Food Cost الفعلي</span><span class="val">${pct(a.fcActual)}</span><span class="meta">المستهدف ${nf0.format(S.settings.target)}% · مرجّح بالمبيعات</span></div>
    <div class="tile accent"><span class="lbl">متوسط التقييمات</span><span class="val">${avgRating? "★ "+nf1.format(avgRating):"—"}</span><span class="meta">${totRc} تقييم</span></div>
    <div class="tile"><span class="lbl">أعلى هامش مساهمة</span><span class="val sm">${esc(best.name)}</span><span class="meta num">${money(best.cm)} ${cur()} · ${pct(best.cmPct,0)}</span></div>
    <div class="tile"><span class="lbl">الأعلى مبيعاً</span><span class="val sm">${esc(top.name)}</span><span class="meta num">${nf0.format(top.sold)} وحدة · ${pct(top.mix)} من المبيعات</span></div>
    <div class="tile ${review.length?"bad":""}"><span class="lbl">تحتاج مراجعة تسعير</span><span class="val">${review.length}</span><span class="meta">تكلفتها أعلى من المستهدف</span></div>
    <div class="tile ${losing.length?"bad":""}"><span class="lbl">أطباق خاسرة</span><span class="val">${losing.length}</span><span class="meta">هامشها ≤ صفر في قناة واحدة على الأقل</span></div>
  </section>`;
  h += `<section class="grid-3-2">
    <div class="panel"><div class="panel-head"><div><h2>نسبة الهامش لكل طبق</h2><p class="hint">هامش المساهمة كنسبة من سعر البيع الصافي. الخط العمودي = الهامش المطلوب (${nf0.format(100-S.settings.target)}%).</p></div></div>${barsCm(a)}</div>
    <div class="panel"><div class="panel-head"><div><h2>Food Cost مقابل الهامش</h2><p class="hint">على مستوى المبيعات الفعلية</p></div></div>${donut(a)}</div>
  </section>`;
  h += `<section class="panel"><div class="panel-head"><div><h2>توزيع الأطباق على مصفوفة المنيو</h2><p class="hint">التفاصيل والتوصيات في صفحة هندسة المنيو</p></div><a class="btn sm" href="#menu">فتح التحليل</a></div>
    <div class="legend" style="margin-top:0">${Object.entries(CLS).map(([k,c])=>`<span><span class="pill ${k}">${c.ar} (${c.en})</span> <b class="num">${a.rows.filter(r=>r.cls===k).length}</b></span>`).join("")}</div></section>`;
  return h;
}
function barsCm(a){
  const req = 1 - a.target;
  const rows = a.rows.slice().sort((x,y)=>y.cmPct-x.cmPct);
  const max = 1;
  return `<div class="bars">${rows.map(r=>{
    const w = Math.max(0, r.cmPct)/max*100, col = r.cmPct>=req? "var(--good)" : r.cmPct>0? "var(--accent)" : "var(--bad)";
    return `<div class="bar-row"><span class="bn" title="${esc(r.name)}">${esc(r.name)}</span><div class="bar-track" role="img" aria-label="${esc(r.name)}: ${pct(r.cmPct)}"><div class="bar-fill" style="width:${w}%;background:${col}"></div><div class="bar-target" style="inset-inline-start:${req/max*100}%"></div></div><span class="bv">${pct(r.cmPct,0)}</span></div>`;
  }).join("")}</div>`;
}
function donut(a){
  const fc = Math.min(1, Math.max(0, a.fcActual)), R=60, C=2*Math.PI*R;
  return `<div class="donut-wrap"><svg viewBox="0 0 160 160" role="img" aria-label="Food Cost ${pct(fc)} والهامش ${pct(1-fc)}">
    <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="20"/>
    <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--good)" stroke-width="20" stroke-dasharray="${C*(1-fc)} ${C}" stroke-dashoffset="${-C*fc}" transform="rotate(-90 80 80)"/>
    <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--accent)" stroke-width="20" stroke-dasharray="${C*fc} ${C}" transform="rotate(-90 80 80)"/>
    <text x="80" y="78" text-anchor="middle" style="fill:var(--fg);font-family:var(--font-display);font-size:22px;font-weight:700">${pct(fc)}</text>
    <text x="80" y="98" text-anchor="middle" style="fill:var(--muted);font-size:11px">Food Cost</text></svg>
    <div class="kv">
      <div><span><span class="dot" style="background:var(--accent)"></span> تكلفة المواد</span><b>${nf0.format(a.totalCost)} ${cur()}</b></div>
      <div><span><span class="dot" style="background:var(--good)"></span> هامش المساهمة</span><b>${nf0.format(a.totalCm)} ${cur()}</b></div>
      <div><span>الإيراد الصافي</span><b>${nf0.format(a.totalRev)} ${cur()}</b></div>
      ${a.totalComm?`<div><span>عمولات التطبيقات</span><b>${nf0.format(a.totalComm)} ${cur()}</b></div>`:""}
      <div><span>الفرق عن المستهدف</span><b class="${a.fcActual>a.target?"up":"down"}"><bdi dir="ltr">${a.fcActual>a.target?"+":""}${nf1.format((a.fcActual-a.target)*100)}</bdi> نقطة</b></div>
    </div></div>`;
}

function scatter(a){

  const niceStep = (range,n)=>{ const raw=range/n, p=Math.pow(10,Math.floor(Math.log10(raw))), m=raw/p; return (m<1.5?1:m<3.5?2:m<7.5?5:10)*p; };
  const ys = niceStep(maxY-minY,5), xs = niceStep(maxX,5);

  for(let v=0; v<=maxX+1e-9; v+=xs){ g+=`<text x="${x(v)}" y="${H-pb+18}" text-anchor="middle">${nf0.format(v*100)}%</text>`; }
  const qx = x(a.popThreshold), qy = y(a.avgCm);
  const q = `<line x1="${qx}" x2="${qx}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-dasharray="5 5"/><line x1="${pl}" x2="${W-pr}" y1="${qy}" y2="${qy}" stroke="var(--muted)" stroke-dasharray="5 5"/>

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="مخطط مصفوفة المنيو" style="direction:ltr">${g}<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="var(--line)"/>${q}${pts}
    <text x="${(W)/2}" y="${H-6}" text-anchor="middle">نسبة المبيعات (Menu Mix)</text></svg>`;

function ingUsage(){

}

function ingDialog(id){

    </div>
    ${id&&(g.history||[]).length>1?`<div class="field"><label>سجل الأسعار</label><div class="sub-txt">${g.history.slice(-6).map(e=>`<span class="num">${e.d}: ${money(e.p)}</span>`).join(" · ")}</div></div>`:""}
    <p class="err sub-txt" id="g-err" role="alert" style="color:var(--bad);margin:0"></p>`,
    `${id?`<button class="btn danger" type="button" data-act="del-ing" data-id="${id}">${ico("trash",16)}حذف</button>`:""}<div class="end"><button class="btn" type="button" data-close>إلغاء</button><button class="btn primary" type="submit">حفظ المادة</button></div>`));
  dlg.querySelector("form").addEventListener("submit", e=>{
    e.preventDefault(); const fd = new FormData(e.target);

const IN_APP = !!(window.claude && typeof window.claude.use==="function");
async function saveFile(filename, data, mime){
  if(IN_APP){
    const dl = await window.claude.use("downloads");
    if(!dl){ toast("التنزيل غير متاح في هذا العرض"); return false; }
    try{ await dl.save({filename, data}); return true; }catch(e){ if(e && e.code!=="declined") toast("تعذّر التنزيل، أعد المحاولة"); return false; }
  }
  const blob = data instanceof Blob? data : new Blob([data],{type:mime});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000); return true;
}

/* License codes (standalone site) — lightweight check, not a security boundary */
function hash53(str, seed=0){ let h1=0xdeadbeef^seed, h2=0x41c6ce57^seed; for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909); h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909); return (4294967296*(2097151&h2)+(h1>>>0)).toString(36).toUpperCase(); }
function checkCode(code){
  const m = String(code||"").trim().toUpperCase().match(/^MZ-(BASIC|PRO|CONSULT)-(\d{8})-([0-9A-Z]{6,12})$/); if(!m) return null;
  const plan=m[1].toLowerCase(), d=m[2], exp=`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`;
  return hash53(CONFIG.licenseSecret+"|"+plan+"|"+d).slice(0,8)===m[3].slice(0,8)? {plan, exp, code:m[0]} : null;
}

function planImport(res, mode){
  const replace = mode==="replace";
  const ing = replace? {} : JSON.parse(JSON.stringify(S.ing)), dish = replace? {} : JSON.parse(JSON.stringify(S.dish));
  const st = {...S.settings, ...res.settings, sample:false};
  if(res.fixed) st.fixedItems = res.fixed;
  if(res.days) st.days = res.days;
  const stats = {ingNew:0, ingUpd:0, priceCh:0, dishNew:0, dishUpd:0, lines:0, sales:0, ratings:0};
  const errors = res.errors.slice(), warn = res.warn.slice();
  // channels
  let channels = chans().map(c=>({...c}));
  if(res.channels && res.channels.length){
    channels = res.channels.map((c,i)=>{ const ex = chans().find(x=>normName(x.name)===normName(c.name)); const id = i===0? "dinein" : (ex && ex.id!=="dinein"? ex.id : newId("c")); return {id, ...c}; });
    if(channels[0].comm>0) warn.push("القنوات: السطر الأول يُعامل كالفروع، وفيه عمولة أكبر من صفر");
  }
  st.channels = channels;
  // ingredients
  const findBy = (map, code, name) => Object.keys(map).find(k=>code && map[k].code===code) || Object.keys(map).find(k=>normName(map[k].name)===normName(name));
  const ingByCode = {};

    if(id){ const g = ing[id]; const hist=(g.history||[]).slice(); if(!hist.length || Math.abs(+hist[hist.length-1].p - x.price)>1e-9){ hist.push({p:x.price, d:date}); if(hist.length>1) stats.priceCh++; }
      ing[id] = {...g, name:x.name, unit:x.unit, yield:x.yield, code:x.code||g.code||"", history:hist.slice(-24)}; stats.ingUpd++; }
    else { id = newId("i"); ing[id] = {name:x.name, unit:x.unit, yield:x.yield, code:x.code||"", history:[{p:x.price, d:date}]}; stats.ingNew++; }
    if(x.code) ingByCode[x.code]=id; ingByCode["name:"+normName(x.name)]=id; });
  const ingRef = c => ingByCode[c] || Object.keys(ing).find(k=>ing[k].code===c) || ingByCode["name:"+normName(c)] || Object.keys(ing).find(k=>normName(ing[k].name)===normName(c));
  // dishes
  const dishByCode = {};
  res.dishes.forEach(x=>{ let id = findBy(dish, x.code, x.name);
    if(id){ dish[id] = {...dish[id], name:x.name, price:x.price, code:x.code||dish[id].code||""}; stats.dishUpd++; }
    else { id = newId("d"); dish[id] = {name:x.name, price:x.price, code:x.code||"", sold:0, ch:{}, lines:[], rs:0, rc:0}; stats.dishNew++; }
    if(x.code) dishByCode[x.code]=id; dishByCode["name:"+normName(x.name)]=id; });
  const dishRef = c => dishByCode[c] || Object.keys(dish).find(k=>dish[k].code===c) || dishByCode["name:"+normName(c)] || Object.keys(dish).find(k=>normName(dish[k].name)===normName(c));
  // recipes
  const newLines = {};
  res.recipes.forEach(x=>{ const did=dishRef(x.d), iid=ingRef(x.m);
    if(!did){ errors.push(`الوصفات · سطر ${x.line}: رمز الطبق ${x.d} غير موجود في ورقة الأطباق`); return; }
    if(!iid){ errors.push(`الوصفات · سطر ${x.line}: رمز المادة ${x.m} غير موجود في ورقة المواد الأولية`); return; }
    (newLines[did]=newLines[did]||[]).push({i:iid, q:x.q}); stats.lines++; });

  res.sales.forEach(x=>{ const did=dishRef(x.d); if(!did){ errors.push(`المبيعات · سطر ${x.line}: رمز الطبق ${x.d} غير موجود`); return; }

  if(Object.keys(dish).length > p.limits.dishes) errors.push(`عدد الأطباق بعد الاستيراد ${Object.keys(dish).length} يتجاوز حدّ باقتك ${p.name} (${p.limits.dishes}). رقِّ الباقة أو قلّل الأطباق.`);

  return {ing, dish, settings:st, stats, errors, warn, mode};

function needCfg(){

const periodSold = (d, n) => { const cs=chans(), sel = n.ch==="all"? cs : cs.filter(c=>c.id===n.ch); return sel.reduce((t,c)=>t+chSold(d,c.id),0); };
function needDishQty(){
  const n = needCfg(), pdays = Math.max(1,+S.settings.days||30);
  const f = (n.mode==="days"? Math.max(0,+n.days||0)/pdays : 1) * (1 + (+n.growth||0)/100);
  return Object.entries(S.dish).map(([id,d])=>{ const base = periodSold(d,n);
    if(n.mode==="manual"){ const v=n.qty[id]; const has = v!=null && v!=="" && isFinite(+v); return {id, d, base, auto:0, qty: has? Math.max(0,+v) : 0, ov:false, entered:has}; }
    const auto = base*f, ov = n.ov[id], has = ov!=null && ov!=="" && isFinite(+ov);
    return {id, d, base, auto, qty: has? Math.max(0,+ov) : auto, ov:has, entered:true}; });
}
function computeNeeds(){
  const dq = needDishQty(), n = needCfg(), rows = {};
  const dishRows = dq.filter(x=>x.qty>0).map(x=>{
    const lines = (x.d.lines||[]).map(l=>{ const g=S.ing[l.i]; if(!g) return null; const y=Math.max(1,+g.yield||100)/100, per=+l.q||0, net=per*x.qty, gross=net/y, price=ingPrice(g), cost=gross*price;
      const r = rows[l.i] || (rows[l.i] = {id:l.i, g, net:0, dishes:new Set()}); r.net += net; r.dishes.add(x.d.name);
      return {g, per, net, gross, y, price, cost}; }).filter(Boolean);
    const total = lines.reduce((t,l)=>t+l.cost,0);
    return {...x, lines, unitCost: x.qty? total/x.qty : dishCost(x.d), total};
  }).sort((a,b)=>b.total-a.total);
  const list = Object.values(rows).map(r=>{ const y=Math.max(1,+r.g.yield||100)/100, price=ingPrice(r.g), gross=r.net/y, cost=gross*price, stock=Math.max(0,+(n.stock[r.id]||0)), buy=Math.max(0,gross-stock);
    return {...r, y, price, gross, cost, stock, buy, buyCost:buy*price}; }).filter(r=>r.net>0).sort((a,b)=>b.cost-a.cost);
  const total = list.reduce((t,r)=>t+r.cost,0), buyTotal = list.reduce((t,r)=>t+r.buyCost,0);
  list.forEach(r=>r.share = total? r.cost/total : 0);
  const units = dq.reduce((t,x)=>t+x.qty,0);
  const sales = dishRows.reduce((t,x)=>t+netPrice(x.d)*x.qty,0);
  return {list, total, buyTotal, dishRows, dq, units, sales};
}

function startLocal(){
  db = null; S.mode="local";
  const saved = lsLoad();
  if(saved){ S.settings={...DEFAULT_SETTINGS,...saved.settings}; S.ing=saved.ingredients||{}; S.dish=saved.dishes||{}; S.notes={...EMPTY_NOTES(), ...(saved.notes||{})}; }
  else { const s=JSON.parse(JSON.stringify(SAMPLE)); S.settings=s.settings; S.ing=s.ingredients; S.dish=s.dishes; S.notes=s.notes; }
  loadLicense();
  render();
}
async function boot(){
  render();
  const c = window.claude;
  if(!c || typeof c.use!=="function"){ startLocal(); return; }
  let d = null;
  try{ d = await c.use("db"); }catch(e){ d=null; }
  if(!d){ startLocal(); return; }
  let uid = null, canWrite = null;
  try{ const u = await c.use("user"); if(u){ uid = await u.id(); if(typeof u.can==="function") canWrite = await u.can("data.write"); } }catch(e){}
  if(!uid || canWrite===false){ S.localNote = true; startLocal(); return; }
  db = d; WS = db.doc("data/users/"+uid+"/ws"); S.mode = "db"; S.uid = uid;
  try{ const u = await c.use("user"); S.isOwner = !!(u && u.isOwner && await u.isOwner()); }catch(e){}
  const timer = setTimeout(()=>{ S.stale = true; render(); }, 10000);
  const fresh = ()=>{ if(S.loaded.ing && S.loaded.dish && S.loaded.set){ clearTimeout(timer); if(S.stale){ S.stale=false; } } };
  const onErr = ()=>{ clearTimeout(timer); S.stale = true; render(); };
  const toMap = snap => { const m={}; snap.docs.forEach(x=>{ m[x.id]=x.data(); }); return m; };
  col("ingredients").onSnapshot(s=>{ S.ing=toMap(s); if(!s.metadata.fromCache) S.loaded.ing=true; fresh(); render(); }, onErr);
  col("dishes").onSnapshot(s=>{ S.dish=toMap(s); if(!s.metadata.fromCache) S.loaded.dish=true; fresh(); render(); }, onErr);
  setRef().onSnapshot(s=>{ if(s.exists) S.settings={...DEFAULT_SETTINGS, ...s.data()}; if(!s.metadata.fromCache) S.loaded.set=true; fresh(); render(); }, onErr);
  WS.collection("meta").doc("need").get().then(s=>{ if(s.exists){ S.need={...NEED_DEF(), ...s.data()}; if(route()==="needs") render(); } }).catch(()=>{});
  notesRef().onSnapshot(s=>{ if(s.exists) S.notes={...EMPTY_NOTES(), ...s.data()}; render(); }, ()=>{});
  db.doc("plans/"+uid).onSnapshot(s=>{ S.planDoc = s.exists? s.data() : null; render(); }, ()=>{});
  db.doc("requests/"+uid).onSnapshot(s=>{ S.myReq = s.exists? s.data() : null; render(); }, ()=>{});
  if(S.isOwner){
    db.collection("requests").onSnapshot(s=>{ S.reqs = toMap(s); render(); }, ()=>{});
    db.collection("plans").onSnapshot(s=>{ S.plansAll = toMap(s); render(); }, ()=>{});
  }
}
