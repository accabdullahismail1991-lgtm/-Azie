function attachModalEvents(){
  const overlay = document.getElementById('overlay');
  overlay.addEventListener('click', (ev)=>{ if(ev.target.id==='overlay'){ state.modal=null; render(); } });
  const closeBtn = document.getElementById('closeModal');
  if(closeBtn) closeBtn.addEventListener('click', ()=>{ state.modal=null; render(); });

  const testConn = document.getElementById('testConn');
  if(testConn) testConn.addEventListener('click', async ()=>{
    const url = document.getElementById('conn_url').value.trim();
    const key = document.getElementById('conn_key').value.trim();
    if(!url || !key){ alert('الرجاء تعبئة رابط النظام ومفتاح API'); return; }
    testConn.textContent = 'جارِ الاختبار...'; testConn.disabled = true;
    await new Promise(r=>setTimeout(r,900));
    state.integrations[state.modal.sys] = {
      connected:true, urlMasked: url, keyMasked: key.slice(0,4)+'••••'+key.slice(-3),
      branch: document.getElementById('conn_branch').value,
      lastSync: new Date().toLocaleString('ar-SA')
    };
    await sset('ns_integrations', state.integrations);
    state.modal = null; render();
  });

  const saveUser = document.getElementById('saveUser');
  if(saveUser) saveUser.addEventListener('click', async ()=>{
    const username = document.getElementById('nu_username').value.trim();
    const password = document.getElementById('nu_password').value;
    const displayName = document.getElementById('nu_display').value.trim();
    const role = document.getElementById('nu_role').value;
    const branch = document.getElementById('nu_branch').value;
    if(!username || !password || !displayName){ alert('الرجاء تعبئة جميع الحقول'); return; }
    if(state.users.some(u=>u.username===username)){ alert('اسم المستخدم موجود مسبقًا'); return; }
    state.users.push({username,password,displayName,role,branch});
    await sset('ns_users', state.users);
    state.modal = null; render();
  });

  const saveBranch = document.getElementById('saveBranch');
  if(saveBranch) saveBranch.addEventListener('click', async ()=>{
    const name = document.getElementById('nb_name').value.trim();
    if(!name){ alert('الرجاء إدخال اسم الفرع'); return; }
    if(state.branches.includes(name)){ alert('الفرع موجود مسبقًا'); return; }
    state.branches.push(name);
    await sset('ns_branches', state.branches);
    state.modal = null; render();
  });

  const saveEditBranch = document.getElementById('saveEditBranch');
  if(saveEditBranch) saveEditBranch.addEventListener('click', async ()=>{
    const oldName = state.modal.branch;
    const newName = document.getElementById('eb_name').value.trim();
    if(!newName){ alert('الرجاء إدخال اسم الفرع'); return; }
    if(newName!==oldName && state.branches.includes(newName)){ alert('يوجد فرع آخر بنفس هذا الاسم مسبقًا'); return; }
    if(newName!==oldName){
      const idx = state.branches.indexOf(oldName);
      if(idx>-1) state.branches[idx] = newName;
      state.entries.forEach(e=>{ if(e.branch===oldName) e.branch=newName; });
      state.externalSales.forEach(e=>{ if(e.branch===oldName) e.branch=newName; });
      state.bankSettlements.forEach(b=>{ if(b.branch===oldName) b.branch=newName; });
      state.users.forEach(u=>{ if(u.branch===oldName) u.branch=newName; });
      Object.values(state.integrations).forEach(i=>{ if(i && i.branch===oldName) i.branch=newName; });
      if(state.branchSheets[oldName]){ state.branchSheets[newName] = state.branchSheets[oldName]; delete state.branchSheets[oldName]; }
      await Promise.all([
        sset('ns_branches', state.branches),
        sset('ns_entries', state.entries),
        sset('ns_external_sales', state.externalSales),
        sset('ns_bank_settlements', state.bankSettlements),
        sset('ns_users', state.users),
        sset('ns_integrations', state.integrations),
        sset('ns_branch_sheets', state.branchSheets),
      ]);
      if(state.currentUser.branch===oldName) state.currentUser.branch = newName;
      if(state.dailyFilter && state.dailyFilter.branch===oldName) state.dailyFilter.branch = newName;
      if(state.filters.branch===oldName) state.filters.branch = newName;
    }
    state.modal = null; render();
  });

  const saveSheetLink = document.getElementById('saveSheetLink');
  if(saveSheetLink) saveSheetLink.addEventListener('click', async ()=>{
    const branch = state.modal.branch;
    const url = document.getElementById('es_url').value.trim();
    if(!url){ alert('الرجاء إدخال رابط الشيت'); return; }
    state.branchSheets[branch] = {url, lastSync: (getSheetConfig(branch)||{}).lastSync || null};
    await sset('ns_branch_sheets', state.branchSheets);
    state.modal = null; render();
  });
  const removeSheetLink = document.getElementById('removeSheetLink');
  if(removeSheetLink) removeSheetLink.addEventListener('click', async ()=>{
    delete state.branchSheets[state.modal.branch];
    await sset('ns_branch_sheets', state.branchSheets);
    state.modal = null; render();
  });

  const saveEditExternal = document.getElementById('saveEditExternal');
  if(saveEditExternal) saveEditExternal.addEventListener('click', async ()=>{
    const rec = state.externalSales.find(e=>e.id===state.modal.id);
    if(!rec){ state.modal=null; render(); return; }
    const oldCredit = computeTotals(rec).totalCredit;
    rec.date = document.getElementById('ee_date').value;
    rec.branch = document.getElementById('ee_branch').value;
    rec.shift = document.getElementById('ee_shift').value;
    rec.cash = num(document.getElementById('ee_cash').value);
    rec.span = num(document.getElementById('ee_span').value);
    rec.visa = num(document.getElementById('ee_visa').value);
    rec.mastercard = num(document.getElementById('ee_mastercard').value);
    rec.discountReturn = num(document.getElementById('ee_discountReturn').value);
    rec.expenses = num(document.getElementById('ee_expenses').value);
    const newCredit = num(document.getElementById('ee_credit').value);
    const delta = newCredit - oldCredit;
    rec.otherCreditSales = num(rec.otherCreditSales) + delta;
    await sset('ns_external_sales', state.externalSales);
    state.modal = null; render();
  });

  const saveEditEntry = document.getElementById('saveEditEntry');
  if(saveEditEntry) saveEditEntry.addEventListener('click', async ()=>{
    const rec = state.entries.find(e=>e.id===state.modal.id);
    if(!rec){ state.modal=null; render(); return; }
    const fields = readPaymentFields('en');
    rec.date = document.getElementById('en_date').value;
    rec.branch = document.getElementById('en_branch').value;
    rec.shift = document.getElementById('en_shift').value;
    rec.cashierName = document.getElementById('en_cashier').value.trim() || rec.cashierName;
    Object.assign(rec, fields);
    if(!rec.date){ alert('التاريخ مطلوب'); return; }
    await sset('ns_entries', state.entries);
    state.modal = null; render();
  });
}

/* ============ DEMO DATA & BACKUP/RESTORE ============ */
const DEMO_DAYS = 14;
const DEMO_CASHIER_NAMES = ['صلاح السوداني','انجور مياه','محمد صالح','عادل شهاب','فهد العتيبي'];
function randFloat(min,max){ return round2(Math.random()*(max-min)+min); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
async function loadDemoData(){
  const branches = state.branches.length? state.branches : [BRANCH_DEFAULT];
  const today = new Date();
  const newEntries = [], newExternal = [], newBank = [];
  for(let d=0; d<DEMO_DAYS; d++){
    const dt = new Date(today); dt.setDate(dt.getDate()-d);
    const dateStr = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    branches.forEach((branch, bi)=>{
      ['morning','evening'].forEach((shift,si)=>{
        const cashierName = DEMO_CASHIER_NAMES[(d+si+bi)%DEMO_CASHIER_NAMES.length];
        const entry = {
          id: uid(), date: dateStr, branch, shift, cashierName,
          cash: randFloat(150,500), span: randFloat(800,2200), visa: randFloat(50,300), mastercard: randFloat(0,150),
          discountReturn: Math.random()<0.3? randFloat(0,40):0, expenses: Math.random()<0.2? randFloat(0,150):0,
          createdBy:'demo', createdAt:new Date().toISOString(), source:'demo-data', isDemo:true
        };
        DELIVERY_PLATFORMS.forEach(p=>{ entry[p.key] = Math.random()<0.7 ? randFloat(0,600) : 0; });
        newEntries.push(entry);

        if(Math.random()<0.65){
          const variance = randFloat(-40,40);
          const ext = Object.assign({}, entry);
          ext.id = uid();
          ext.cash = round2(entry.cash + variance*0.3);
          ext.span = round2(entry.span + variance*0.4);
          ext.system = INTEGRATION_SYSTEMS[randInt(0,INTEGRATION_SYSTEMS.length-1)].key;
          ext.createdBy='demo'; ext.createdAt=new Date().toISOString(); ext.isDemo = true;
          delete ext.source;
          newExternal.push(ext);
        }
      });
      if(Math.random()<0.5){
        newBank.push({id:uid(), date:dateStr, branch, amount: randFloat(2000,4000), createdBy:'demo', createdAt:new Date().toISOString(), isDemo:true});
      }
    });
  }
  // Idempotent: strip any previously loaded demo data before adding the fresh batch, so repeated clicks never duplicate.
  state.entries = state.entries.filter(e=>!e.isDemo).concat(newEntries);
  state.externalSales = state.externalSales.filter(e=>!e.isDemo).concat(newExternal);
  state.bankSettlements = state.bankSettlements.filter(b=>!b.isDemo).concat(newBank);
  await sset('ns_entries', state.entries);
  await sset('ns_external_sales', state.externalSales);
  await sset('ns_bank_settlements', state.bankSettlements);
  await logImportOperation('file', 'بيانات تجريبية للاختبار ('+DEMO_DAYS+' يوم) — تم استبدال أي بيانات تجريبية سابقة', 'كل الفروع', newEntries.length);
  render();
}

function exportFullBackup(){
  const backup = {
    version:1, exportedAt: new Date().toISOString(),
    entries: state.entries, externalSales: state.externalSales, bankSettlements: state.bankSettlements,
    branches: state.branches, users: state.users, integrations: state.integrations,
    platformReports: state.platformReports, importLog: state.importLog, reportArchive: state.reportArchive, branchSheets: state.branchSheets
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = 'نسخة-احتياطية-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function importFullBackup(file){
  const text = await file.text();
  let data;
  try{ data = JSON.parse(text); }catch(e){ alert('ملف النسخة الاحتياطية غير صالح'); return; }
  if(!confirm('سيتم استبدال كل البيانات الحالية بمحتوى هذه النسخة الاحتياطية. هل تريد المتابعة؟')) return;
  state.entries = data.entries||[]; state.externalSales = data.externalSales||[]; state.bankSettlements = data.bankSettlements||[];
  state.branches = data.branches||state.branches; state.users = data.users||state.users; state.integrations = data.integrations||{};
  state.platformReports = data.platformReports||[]; state.importLog = data.importLog||[]; state.reportArchive = data.reportArchive||[];
  state.branchSheets = data.branchSheets||{};
  await Promise.all([
    sset('ns_entries', state.entries), sset('ns_external_sales', state.externalSales), sset('ns_bank_settlements', state.bankSettlements),
    sset('ns_branches', state.branches), sset('ns_users', state.users), sset('ns_integrations', state.integrations),
    sset('ns_platform_reports', state.platformReports), sset('ns_import_log', state.importLog), sset('ns_report_archive', state.reportArchive),
    sset('ns_branch_sheets', state.branchSheets)
  ]);
  render();
}

    <div class="panel-title">الفروع <button class="btn btn-gold btn-sm" id="addBranchBtn">+ إضافة فرع</button></div>
    <div class="notice">المزامنة التلقائية لبيانات جوجل شيت المرتبطة تعمل كل ${AUTO_SYNC_MINUTES} دقائق طالما الصفحة مفتوحة، بالإضافة لإمكانية التحديث الفوري يدويًا من هنا.</div>
    <div class="table-wrap"><table style="min-width:600px;">
      <thead><tr><th>اسم الفرع</th><th>عدد سجلات المبيعات</th><th>حالة ربط جوجل شيت</th><th>—</th></tr></thead>
      <tbody>${state.branches.map(b=>{
        const count = state.entries.filter(e=>e.branch===b).length;
        const cfg = getSheetConfig(b);
        return `<tr>
          <td class="name-cell">${b}</td><td>${count}</td>
          <td class="name-cell" style="font-size:11px;color:${cfg?'var(--green)':'var(--ink-soft)'};">
            ${cfg? `✓ مرتبط${cfg.lastSync? ' — آخر مزامنة: '+new Date(cfg.lastSync).toLocaleString('ar-SA') : ' — لم تتم مزامنة بعد'}` : 'غير مرتبط'}
          </td>
          <td style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;">
            ${cfg? `<button class="btn btn-gold btn-sm" data-syncnow="${b}">🔄 مزامنة الآن</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-editsheet="${b}">${cfg?'تعديل الرابط':'ربط جوجل شيت'}</button>
            <button class="btn btn-ghost btn-sm" data-editbranch="${b}">تعديل الاسم</button>
            ${count===0 && !state.users.some(u=>u.branch===b) ? `<button class="btn btn-danger" data-delbranch="${b}">حذف</button>` : ''}
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
  </div>`;
}
function attachUsersEvents(){
  const saveBrandingBtn = document.getElementById('saveBrandingBtn');
  if(saveBrandingBtn) saveBrandingBtn.addEventListener('click', async ()=>{
    const name = document.getElementById('sys_name').value.trim();
    const subtitle = document.getElementById('sys_subtitle').value.trim();
    const logoText = document.getElementById('sys_logo_text').value.trim();
    const logoFile = document.getElementById('sys_logo_file').files[0];
    if(name) state.systemName = name;
    if(subtitle) state.systemSubtitle = subtitle;
    if(logoFile){
      const dataUrl = await new Promise((res,rej)=>{
        const r = new FileReader();
        r.onload = ()=>res(r.result);
        r.onerror = rej;
        r.readAsDataURL(logoFile);
      });
      state.systemLogo = {type:'image', data: dataUrl};
    } else if(logoText){
      state.systemLogo = {type:'text', value: logoText};
    }
    document.title = state.systemName + ' | ' + state.systemSubtitle;
    updateFavicon();
    await sset('ns_system_name', state.systemName);
    await sset('ns_system_subtitle', state.systemSubtitle);
    await sset('ns_system_logo', state.systemLogo);
    render();
  });

  const loadDemoBtn = document.getElementById('loadDemoBtn');
  if(loadDemoBtn) loadDemoBtn.addEventListener('click', async ()=>{
    loadDemoBtn.textContent = 'جارِ التحميل...'; loadDemoBtn.disabled = true;
    await loadDemoData();
  });
  const clearDataBtn = document.getElementById('clearDataBtn');
  if(clearDataBtn) clearDataBtn.addEventListener('click', async ()=>{
    if(!confirm('سيتم حذف كل الورديات والمصادقات والتسويات والأرشيف نهائيًا (المستخدمون والفروع تبقى). هل أنت متأكد؟')) return;
    await clearAllSalesData();
  });
  const exportBackupBtn = document.getElementById('exportBackupBtn');
  if(exportBackupBtn) exportBackupBtn.addEventListener('click', exportFullBackup);
  const importBackupFile = document.getElementById('importBackupFile');
  if(importBackupFile) importBackupFile.addEventListener('change', async ()=>{
    const file = importBackupFile.files[0];
    if(file) await importFullBackup(file);
  });

  document.getElementById('addUserBtn').addEventListener('click', ()=>{ state.modal={type:'addUser'}; render(); });
  document.getElementById('addBranchBtn').addEventListener('click', ()=>{ state.modal={type:'addBranch'}; render(); });
  document.querySelectorAll('[data-deluser]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('تأكيد حذف هذا المستخدم؟')) return;
    state.users = state.users.filter(u=>u.username!==b.dataset.deluser);
    await sset('ns_users', state.users);
    render();
  }));
  document.querySelectorAll('[data-editbranch]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = {type:'editBranch', branch:b.dataset.editbranch}; render();
  }));
  document.querySelectorAll('[data-editsheet]').forEach(b=>b.addEventListener('click', ()=>{
    state.modal = {type:'editSheet', branch:b.dataset.editsheet}; render();
  }));
  document.querySelectorAll('[data-syncnow]').forEach(b=>b.addEventListener('click', async ()=>{
    const branch = b.dataset.syncnow;
    b.textContent = 'جارِ المزامنة...'; b.disabled = true;
    const res = await syncBranchFromSheet(branch, false);
    if(!res.ok){ alert('تعذّرت المزامنة: '+(res.error? res.error.message : 'خطأ غير معروف')); }
    render();
  }));
  document.querySelectorAll('[data-delbranch]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('تأكيد حذف هذا الفرع؟ (لا يمكن التراجع)')) return;
    state.branches = state.branches.filter(x=>x!==b.dataset.delbranch);
    await sset('ns_branches', state.branches);
    render();
  }));
}

/* ============ INIT ============ */
(async function init(){
  render();
  try{
    window.__allowedScreens = await AzieScreens.fetchAllowed('cashier-nassim');
  }catch(err){
    console.error(err);
    window.__allowedScreens = [];
  }
  await loadAll();
  const session = await spget('ns_session', null);
  if(session && session.username){
    const found = state.users.find(x=>x.username===session.username);
    if(found){
      state.currentUser = found;
      const hashView = (location.hash||'').replace('#','');
      const validViews = tabsFor(found.role).map(t=>t.k);
      state.view = validViews.includes(hashView) ? hashView : defaultViewFor(found.role);
      location.hash = state.view;
    } else {
      await spset('ns_session', null);
    }
  }
  render();
  startAutoSyncTimer();
})();
</script>
