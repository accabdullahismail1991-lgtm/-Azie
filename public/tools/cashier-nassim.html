<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الكاشير | النسيم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

:root{
  --paper:#F3F1EA;
  --paper-alt:#E9E4D6;
  --ink:#1E2420;
  --ink-soft:#5B6459;
  --green:#2E6B4C;
  --green-deep:#173C2A;
  --red:#A6402F;
  --gold:#B8862E;
  --line:#CFC8B5;
  --white:#FFFFFF;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  min-height:100vh;
}
.mono{font-family:'IBM Plex Mono',monospace;}
button{font-family:'Cairo',sans-serif;cursor:pointer;border:none;}
input,select{font-family:'Cairo',sans-serif;}

/* ===== Brand mark ===== */
.brand{
  display:flex;align-items:center;gap:10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:6px;
  background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  color:var(--green-deep);font-weight:900;font-family:'IBM Plex Mono',monospace;
  font-size:15px;
}
.brand-title{font-weight:800;font-size:17px;letter-spacing:.2px;}
.brand-sub{font-size:11px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;letter-spacing:1px;}

/* ===== Login ===== */
.login-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:
    radial-gradient(circle at 20% 20%, rgba(46,107,76,.06), transparent 40%),
    radial-gradient(circle at 80% 80%, rgba(184,134,46,.08), transparent 40%),
    var(--paper);
  padding:24px;
}
.receipt{
  width:380px;max-width:100%;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:0 18px 40px -18px rgba(23,60,42,.35);
  position:relative;
  padding:28px 26px 26px;
}
.receipt::before{
  content:"";
  position:absolute;top:-8px;right:0;left:0;height:16px;
  background-image: radial-gradient(circle at 8px 8px, var(--paper) 8px, transparent 8.5px);
  background-size:16px 16px;
  background-position:0 0;
}
.receipt-head{text-align:center;margin-bottom:18px;}
.receipt-head .brand{justify-content:center;margin-bottom:6px;}
.receipt-dash{border-top:1px dashed var(--line);margin:16px 0;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
.field input,.field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  background:var(--paper);font-size:14px;color:var(--ink);
}
.field input:focus,.field select:focus{outline:2px solid var(--green);outline-offset:1px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 16px;border-radius:6px;font-weight:700;font-size:14px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--green-deep);color:var(--white);width:100%;}
.btn-primary:hover{background:var(--green);}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
.btn-ghost:hover{background:var(--paper-alt);}
.btn-gold{background:var(--gold);color:var(--green-deep);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);padding:6px 10px;font-size:12.5px;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.error-box{
  background:#FBEAE7;border:1px solid var(--red);color:var(--red);
  padding:8px 10px;border-radius:6px;font-size:12.5px;margin-bottom:12px;
}
.demo-box{
  margin-top:16px;background:var(--paper-alt);border:1px dashed var(--line);
  border-radius:6px;padding:10px 12px;font-size:11.5px;color:var(--ink-soft);
  font-family:'IBM Plex Mono',monospace;line-height:1.9;
}
.demo-box b{color:var(--ink);}

/* ===== App shell ===== */
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.topbar{
  background:var(--green-deep);color:var(--white);
  padding:12px 22px;display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:10px;
}
.topbar .brand-title{color:var(--white);}
.topbar .brand-sub{color:#B9CBBE;}
.topbar-right{display:flex;align-items:center;gap:14px;}
.user-chip{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
  padding:6px 12px;border-radius:20px;font-size:12.5px;
}
.role-badge{
  font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 7px;border-radius:10px;
  background:var(--gold);color:var(--green-deep);font-weight:700;
}
.logout-link{color:#DCE7DF;font-size:12.5px;background:none;text-decoration:underline;}

.tabbar{
  background:var(--white);border-bottom:1px solid var(--line);
  padding:0 22px;display:flex;gap:4px;overflow-x:auto;
}
.tab{
  padding:13px 16px;font-size:13.5px;font-weight:600;color:var(--ink-soft);
  border-bottom:3px solid transparent;background:none;white-space:nowrap;
}
.tab.active{color:var(--green-deep);border-bottom-color:var(--gold);}
.tab:hover{color:var(--green-deep);}

.content{flex:1;padding:22px;max-width:1280px;width:100%;margin:0 auto;}

/* ===== Cards / KPI ===== */
.grid{display:grid;gap:14px;}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:20px;}
.kpi{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
}
.kpi::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--green);}
.kpi.neg::before{background:var(--red);}
.kpi.gold::before{background:var(--gold);}
.kpi-label{font-size:11px;color:var(--ink-soft);font-weight:700;letter-spacing:.4px;margin-bottom:8px;}
.kpi-value{font-family:'IBM Plex Mono',monospace;font-size:23px;font-weight:700;color:var(--green-deep);}
.kpi-value.red{color:var(--red);}

.panel{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;margin-bottom:18px;
}
.panel-title{font-size:15px;font-weight:800;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.section-eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:1.5px;
  color:var(--gold);font-weight:700;margin-bottom:4px;text-transform:uppercase;
}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
.form-grid .field{margin-bottom:0;}
.fieldset-title{font-size:12.5px;font-weight:700;color:var(--green-deep);margin:20px 0 10px;padding-top:14px;border-top:1px dashed var(--line);}
.fieldset-title:first-of-type{border-top:none;padding-top:0;margin-top:4px;}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:12.5px;}
thead th{
  background:var(--green-deep);color:var(--white);padding:9px 10px;text-align:center;
  font-weight:600;white-space:nowrap;position:sticky;top:0;
}
tbody td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-family:'IBM Plex Mono',monospace;}
tbody td.name-cell{font-family:'Cairo',sans-serif;text-align:right;}
tbody tr:nth-child(even){background:var(--paper);}
tbody tr:hover{background:#EDE6D2;}
td.total-col{font-weight:700;color:var(--green-deep);}
td.net-col{font-weight:700;color:var(--gold);}

/* ===== Filters ===== */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px;}
.filters .field{min-width:150px;margin-bottom:0;}

/* ===== Receipt summary (signature element) ===== */
.receipt-summary{
  background:var(--green-deep);color:var(--white);border-radius:var(--radius);
  padding:20px 22px;font-family:'IBM Plex Mono',monospace;
  background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.02) 0 2px, transparent 2px 8px);
}
.receipt-summary .line{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px dashed rgba(255,255,255,.18);}
.receipt-summary .line:last-child{border-bottom:none;}
.receipt-summary .grand{font-size:17px;font-weight:700;color:#F3D48A;padding-top:10px;margin-top:6px;border-top:1px solid rgba(255,255,255,.3);}

/* ===== Integrations ===== */
.integration-grid{grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}
.integration-card{
  background:var(--white);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
}
.integration-card .icon{
  width:38px;height:38px;border-radius:8px;background:var(--paper-alt);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green-deep);
  font-family:'IBM Plex Mono',monospace;margin-bottom:12px;
}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:5px;}
.status-dot.off{background:#B7AF9C;}
.status-dot.on{background:var(--green);}
.status-pill{
  font-size:11px;padding:3px 9px;border-radius:20px;background:var(--paper-alt);
  color:var(--ink-soft);font-weight:700;display:inline-flex;align-items:center;
}
.status-pill.on{background:#E4F0E8;color:var(--green-deep);}
.mapping-list{font-size:11.5px;color:var(--ink-soft);margin-top:10px;line-height:1.9;}
.notice{
  background:#FBF3E1;border:1px solid var(--gold);color:#6B5115;padding:10px 14px;
  border-radius:8px;font-size:12.5px;margin-bottom:16px;
}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(23,30,26,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;}
.modal{background:var(--white);border-radius:var(--radius);padding:22px;width:420px;max-width:100%;max-height:88vh;overflow:auto;}
.modal-title{font-weight:800;font-size:15.5px;margin-bottom:14px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}

.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13.5px;}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;}
.bar-label{width:120px;flex-shrink:0;color:var(--ink-soft);}
.bar-track{flex:1;background:var(--paper-alt);border-radius:4px;height:14px;overflow:hidden;}
.bar-fill{height:100%;background:var(--green);border-radius:4px;width:0;transition:width 1s cubic-bezier(.22,1,.36,1);animation:barGrow 1s cubic-bezier(.22,1,.36,1) forwards;}
@keyframes barGrow{ from{ width:0; } }
.bar-val{width:90px;text-align:left;font-family:'IBM Plex Mono',monospace;font-weight:600;flex-shrink:0;}
.toolbar-btn{padding:6px 12px;font-size:12px;}
@page{ size: A4 landscape; margin: 8mm; }
.print-header{ display:none; }
.signature-block{ display:none; }
@media print{
  .topbar, .tabbar, .filters, .no-print, button{ display:none !important; }
  body, .content{ background:#fff !important; width:100% !important; max-width:100% !important; margin:0 !important; padding:0 !important; font-size:9px; }
  .panel{ border:1px solid #999; break-inside:avoid; page-break-inside:avoid; box-shadow:none; width:100% !important; max-width:100% !important; padding:8px !important; margin-bottom:8px !important; overflow:hidden; }
  .table-wrap{ overflow:visible !important; border:none; width:100% !important; max-width:100% !important; }
  table{
    font-size:7.3px; width:100% !important; max-width:100% !important;
    table-layout:fixed; border-collapse:collapse;
  }
  thead{ display:table-header-group; }
  thead th, tbody td{
    white-space:normal !important; word-break:break-word; overflow-wrap:break-word;
    padding:2px 2px; line-height:1.25; vertical-align:middle;
  }
  thead th{ background:#eee !important; color:#000 !important; font-size:7px; }
  tr{ page-break-inside:avoid; }
  .receipt-summary{ background:#fff !important; color:#000 !important; border:1px solid #999; }
  .receipt-summary .line{ border-bottom-color:#ccc; font-size:9px; }
  .receipt-summary .grand{ color:#000 !important; border-top-color:#999; }
  .kpi-grid{ grid-template-columns:repeat(4,1fr) !important; gap:6px !important; }
  .kpi{ padding:8px 10px !important; }
  .kpi-value{ font-size:15px !important; }
  .section-eyebrow, .notice{ font-size:9px; }
  /* Very wide tables (many delivery-platform / detailed columns) get an extra size reduction so nothing is ever clipped */
  .table-wrap table{ font-size:7.3px; }
  .table-wrap table th, .table-wrap table td{ padding:2px 2px; }
  .print-header{
    display:flex !important; align-items:center; gap:12px; justify-content:space-between;
    border-bottom:2px solid #173C2A; padding-bottom:8px; margin-bottom:10px;
  }
  .print-header .ph-brand{ display:flex; align-items:center; gap:10px; }
  .print-header .ph-logo{ width:36px; height:36px; border-radius:6px; overflow:hidden; background:#B8862E; color:#173C2A; display:flex; align-items:center; justify-content:center; font-weight:900; font-family:'IBM Plex Mono',monospace; font-size:14px; }
  .print-header .ph-logo img{ width:100%; height:100%; object-fit:cover; }
  .print-header .ph-name{ font-weight:800; font-size:13px; color:#173C2A; }
  .print-header .ph-branch{ font-size:10px; color:#5B6459; }
  .print-header .ph-meta{ text-align:left; font-size:9px; color:#5B6459; font-family:'IBM Plex Mono',monospace; }
  .signature-block{
    display:block !important; margin-top:20px; page-break-inside:avoid;
  }
  .signature-block table{ width:100%; border-collapse:collapse; }
  .signature-block th, .signature-block td{ border:1px solid #999; padding:8px 6px; font-size:9px; text-align:center; }
  .signature-block .sig-line{ display:block; height:30px; border-bottom:1px solid #666; margin:0 6px; }
}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/assets/azie-data.js"></script>
<script src="/assets/azie-screens.js"></script>
<script>
/* ============ CONSTANTS ============ */
const WEEKDAYS_AR = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DELIVERY_PLATFORMS = [
  {key:'hungerstation', label:'هنجر ستيشن'},
  {key:'toyou', label:'تويو'},
  {key:'mrsool', label:'مرسول'},
  {key:'jahez', label:'جاهز'},
  {key:'foodzone', label:'فود زون'},
  {key:'tekar', label:'تيكار'},
  {key:'noon', label:'نون'},
  {key:'kieta', label:'كيتا'},
  {key:'chefz', label:'ذا شيفز'},
  {key:'ninja', label:'نينجا'},
];
const INTEGRATION_SYSTEMS = [
  {key:'odoo', name:'Odoo', category:'ERP / محاسبة شاملة', map:['المبيعات → مبيعات نقدية/شبكات حسب طريقة الدفع في الفاتورة','المرتجعات → خ.مسموح / مرتجعات','فواتير المشتريات → مشتريات/المصروفات']},
  {key:'foodics', name:'Foodics', category:'نقاط بيع مطاعم', map:['Cash Payments → مبيعات نقدية','Card Payments → مبيعات شبكات (فيزا/ماستر)','Delivery Integrations → أعمدة تطبيقات التوصيل تلقائيًا']},
  {key:'onyx', name:'Onyx POS', category:'نقاط بيع', map:['Shift Reports → وردية صباح/مساء','Cashier Sessions → اسم الكاشير + الفرع']},
  {key:'almanara', name:'المنارة', category:'محاسبة', map:['قيود اليومية → صافي المبيعات', 'سندات القبض → مبيعات نقدية/شبكات']},
  {key:'marn', name:'مرن (Marn)', category:'نقاط بيع سحابية', map:['تقرير الوردية → صف كامل بكل الأعمدة','ربط التوصيل → أعمدة منصات التوصيل']},
  {key:'qoyod', name:'قيود (Qoyod)', category:'محاسبة سحابية', map:['فواتير المبيعات → إجمالي المبيعات','المصروفات → مشتريات/المصروفات']},
];
const BRANCH_DEFAULT = 'النسيم - Al-Nassim';

/* ============ STATE ============ */
let state = {
  loaded:false, users:[], entries:[], integrations:{}, branches:[BRANCH_DEFAULT],
  externalSales:[], bankSettlements:[], dailyFilter:null, platformReports:[], recWizard:null,
  branchSheets:{}, importLog:[], bulkImport:null, quickBatch:null, reportArchive:[], archiveSelection:[], archiveExpanded:[],
  systemName:'نظام الكاشير', systemSubtitle:'النسيم', systemLogo:{type:'text', value:'ن'},
  mindMap:{zoom:100, compact:false, hidden:[], custom:[], positions:{}},
  currentUser:null, view:null, loginError:'', modal:null,
  filters:{branch:'', from:'', to:'', cashier:''},
  importPreview:null, extImportPreview:null, extImpWizard:null
};

/* ============ STORAGE HELPERS ============ */
// window.storage shim: persistent keys (persistent=true) are backed by the
// platform's per-app database blob (server/routes/data.js), loaded once and
// saved (debounced) on every write. Session keys (persistent=false, only
// ns_session) stay in sessionStorage — per-browser-tab, deliberately not
// synced across terminals, since it just remembers which cashier-app user
// was last logged in on THIS device.
window.storage = (function(){
  const APP_ID = 'cashier-nassim';
  let cache = null;
  let ready = null;

  function ensureLoaded(){
    if(!ready){
      ready = AzieData.load(APP_ID).then(data => { cache = data || {}; }).catch(err => {
        console.error('cashier-nassim: فشل تحميل البيانات من الخادم', err);
        cache = {};
      });
    }
    return ready;
  }

  async function get(key, persistent){
    if(persistent === false){
      const raw = sessionStorage.getItem('cashier_session_'+key);
      return raw !== null ? {value: raw} : null;
    }
    await ensureLoaded();
    if(!(key in cache)) return null;
    return {value: JSON.stringify(cache[key])};
  }

  async function set(key, stringValue, persistent){
    if(persistent === false){
      sessionStorage.setItem('cashier_session_'+key, stringValue);
      return;
    }
    await ensureLoaded();
    cache[key] = JSON.parse(stringValue);
    AzieData.debouncedSave(APP_ID, () => cache);
  }

  return {get, set};
})();

async function sget(key, fallback){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function sset(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage error', e); }
}
async function spget(key, fallback){
  try{ const r = await window.storage.get(key, false); return r ? JSON.parse(r.value) : fallback; }
  catch(e){ return fallback; }
}
async function spset(key, val){
  try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ console.error('storage error', e); }
}

async function loadAll(){
  state.users = await sget('ns_users', null);
  if(!state.users){
    state.users = [
      {username:'admin', password:'admin123', role:'admin', displayName:'مدير النظام', branch:''},
      {username:'manager', password:'manager123', role:'manager', displayName:'المدير المسؤول', branch:BRANCH_DEFAULT},
      {username:'salah', password:'1234', role:'cashier', displayName:'صلاح السوداني', branch:BRANCH_DEFAULT},
      {username:'anjor', password:'1234', role:'cashier', displayName:'انجور مياه', branch:BRANCH_DEFAULT},
    ];
    await sset('ns_users', state.users);
  }
  state.entries = await sget('ns_entries', []);
  state.branches = await sget('ns_branches', [BRANCH_DEFAULT]);
  state.integrations = await sget('ns_integrations', {});
  state.externalSales = await sget('ns_external_sales', []);
  state.bankSettlements = await sget('ns_bank_settlements', []);
  state.platformReports = await sget('ns_platform_reports', []);
  state.branchSheets = await sget('ns_branch_sheets', {});
  state.importLog = await sget('ns_import_log', []);
  state.reportArchive = await sget('ns_report_archive', []);
  state.systemName = await sget('ns_system_name', 'نظام الكاشير');
  state.systemSubtitle = await sget('ns_system_subtitle', 'النسيم');
  state.systemLogo = await sget('ns_system_logo', {type:'text', value:'ن'});
  state.mindMap = await sget('ns_mindmap_settings', {zoom:100, compact:false, hidden:[], custom:[], positions:{}});
  if(!state.mindMap.positions) state.mindMap.positions = {};
  document.title = state.systemName + ' | ' + state.systemSubtitle;
  updateFavicon();
  state.loaded = true;
}

/* ============ CALC HELPERS ============ */
function dayNameAr(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  return WEEKDAYS_AR[d.getDay()];
}
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(n){ return Math.round((num(n)+Number.EPSILON)*100)/100; }
function computeTotals(e){
  const totalSpan = num(e.span) + num(e.visa) + num(e.mastercard);
  const totalCredit = DELIVERY_PLATFORMS.reduce((s,p)=> s+num(e[p.key]), 0) + num(e.otherCreditSales);
  const totalSales = num(e.cash) + totalSpan + totalCredit - num(e.discountReturn);
  const totalExpenses = num(e.expenses);
  const netSales = totalSales - totalExpenses;
  return {totalSpan, totalCredit, totalSales, totalExpenses, netSales};
}
function money(n){

/* ============ PRINT & CSV EXPORT ============ */
function doPrint(){ window.print(); }
function downloadCSV(filename, headers, rows){
  const esc = v => { const s = (v===null||v===undefined)?'':String(v); return '"'+s.replace(/"/g,'""')+'"'; };
  const lines = [headers.map(esc).join(',')].concat(rows.map(r=>r.map(esc).join(',')));
  const csv = '\uFEFF' + lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Layer the platform's per-screen permission grant on top of the app's own
// role-based tab list: a tab only shows/works if it's both role-appropriate

};

function svgDonut(segments, size){
  size = size || 170;
  const total = segments.reduce((s,x)=>s+x.value,0);
  const r = size/2 - 16, cx=size/2, cy=size/2, C=2*Math.PI*r;
  let offset=0;
  const arcs = segments.filter(s=>s.value>0).map(seg=>{
    const frac = total>0? seg.value/total : 0;
    const len = Math.max(frac*C, 0);
    const circle = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="24" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"></circle>`;
    offset += len;
    return circle;
  }).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${arcs}<circle cx="${cx}" cy="${cy}" r="${r-15}" fill="var(--white)"></circle></svg>`;
}
function svgEscape(s){ return (s===null||s===undefined?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function truncateLabel(s, n){ s=String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
const MINDMAP_PALETTE = ['#2E6B4C','#B8862E','#A6402F','#1F4A8A','#7A3FA3','#0E7C86'];
const MINDMAP_DEFAULT_CATEGORIES = ['نقدي','شبكات','توصيل (آجل)','مصروفات','صافي المبيعات'];
function slugify(s){ return String(s||'').replace(/[^a-zA-Z0-9\u0600-\u06FF]+/g,'_'); }
function buildMindMapSVG(root, width, height){
  width = width || 960; height = height || 620;
  const cx = width/2, cy = height/2 - 18;
  const cats = (root.children||[]).filter(c=>c.value>0 || (c.children&&c.children.length));
  const n = Math.max(cats.length,1);
  const R1 = Math.min(width,height)*0.30 + n*10;
  const positions = (state.mindMap && state.mindMap.positions) || {};
  let parts = [];
  parts.push(`<defs>
    <filter id="mmShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#173C2A" flood-opacity="0.28"/>
    </filter>
    <radialGradient id="mmBg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="100%" stop-color="#F3F1EA"/>
    </radialGradient>
    <radialGradient id="mmRoot" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#2E6B4C"/>
      <stop offset="100%" stop-color="#173C2A"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="${width}" height="${height}" fill="url(#mmBg)" rx="14"/>`);

  const legend = [];
  cats.forEach((cat, i)=>{
    const key = slugify(cat.customId || cat.label);
    const angle = (i/n)*2*Math.PI - Math.PI/2;
    const defX = cx + R1*Math.cos(angle), defY = cy + R1*Math.sin(angle);
    const pos = positions[key];
    const x1 = pos ? pos.x : defX, y1 = pos ? pos.y : defY;
    const color = cat.color || MINDMAP_PALETTE[i%MINDMAP_PALETTE.length];
    legend.push({label:cat.label, color});
    parts.push(`<line id="mmline-${key}" x1="${cx}" y1="${cy}" x2="${x1}" y2="${y1}" stroke="${color}" stroke-width="4" opacity="0.75" stroke-linecap="round"/>`);
    const catR = 46;
    const children = (cat.children||[]).slice(0,5);
    const m = children.length;
    if(m>0){
      const spread = Math.min(Math.PI/1.5, (2*Math.PI/n)*0.98);
      children.forEach((child,j)=>{
        const childAngle = angle - spread/2 + (m>1? (j/(m-1))*spread : spread/2);
        const R2 = R1 + 150 + m*6;
        const x2 = cx + R2*Math.cos(childAngle), y2 = cy + R2*Math.sin(childAngle);
        parts.push(`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="1.8" opacity="0.45"/>`);
        parts.push(`<circle cx="${x2}" cy="${y2}" r="28" fill="#FFFFFF" stroke="${color}" stroke-width="2.2" filter="url(#mmShadow)"/>`);
        parts.push(`<text x="${x2}" y="${y2-4}" text-anchor="middle" font-size="9.5" font-weight="700" font-family="Cairo,sans-serif" fill="#1E2420">${svgEscape(truncateLabel(child.label,11))}</text>`);
        parts.push(`<text x="${x2}" y="${y2+11}" text-anchor="middle" font-size="9" font-family="IBM Plex Mono,monospace" font-weight="700" fill="${color}">${money(child.value)}</text>`);
      });
    }
    parts.push(`<g class="mm-draggable" data-mmnode="${key}" transform="translate(${x1},${y1})" style="cursor:grab;">
      <circle cx="0" cy="0" r="${catR}" fill="${color}" filter="url(#mmShadow)"/>
      <circle cx="0" cy="0" r="${catR}" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
      <text x="0" y="-8" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FFFFFF" font-family="Cairo,sans-serif">${svgEscape(truncateLabel(cat.label,14))}</text>
      <text x="0" y="11" text-anchor="middle" font-size="12" font-family="IBM Plex Mono,monospace" font-weight="700" fill="#FFFFFF">${money(cat.value)}</text>
      ${cat.pct!==undefined? `<text x="0" y="27" text-anchor="middle" font-size="10" font-family="IBM Plex Mono,monospace" font-weight="700" fill="#F3D48A">${cat.pct.toFixed(1)}%</text>` : ''}
    </g>`);
  });
  parts.push(`<circle cx="${cx}" cy="${cy}" r="60" fill="url(#mmRoot)" filter="url(#mmShadow)"/>`);
  parts.push(`<circle cx="${cx}" cy="${cy}" r="60" fill="none" stroke="#F3D48A" stroke-width="2"/>`);
  parts.push(`<text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="12.5" fill="#FFFFFF" font-weight="800" font-family="Cairo,sans-serif">${svgEscape(truncateLabel(root.label,16))}</text>`);
  parts.push(`<text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="15" fill="#F3D48A" font-family="IBM Plex Mono,monospace" font-weight="800">${money(root.value)}</text>`);

  const legendY = height-26;
  const legendItemW = width/legend.length;
  legend.forEach((l,i)=>{
    const lx = legendItemW*i + legendItemW/2;
    parts.push(`<circle cx="${lx-42}" cy="${legendY}" r="6" fill="${l.color}"/>`);
    parts.push(`<text x="${lx-30}" y="${legendY+4}" text-anchor="start" font-size="10" font-weight="700" font-family="Cairo,sans-serif" fill="#1E2420">${svgEscape(truncateLabel(l.label,14))}</text>`);
  });

  return `<svg id="mindMapSvg" viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;display:block;margin:0 auto;border-radius:14px;">${parts.join('')}</svg>`;
}
function buildTimelineChartSVG(points, width, height){
  width = width || 900; height = height || 300;
  const padL=55, padR=20, padT=20, padB=36;
  const innerW = width-padL-padR, innerH = height-padT-padB;
  if(points.length===0) return `<svg viewBox="0 0 ${width} ${height}"><text x="${width/2}" y="${height/2}" text-anchor="middle" fill="#5B6459" font-size="12">لا توجد بيانات كافية</text></svg>`;
  const maxVal = Math.max(...points.map(p=>p.value), 1);
  const n = points.length;
  const xStep = n>1 ? innerW/(n-1) : 0;
  const xFor = i => padL + i*xStep;
  const yFor = v => padT + innerH - (v/maxVal)*innerH;

  const linePoints = points.map((p,i)=> `${xFor(i).toFixed(1)},${yFor(p.value).toFixed(1)}`).join(' ');
  const areaPoints = `${xFor(0).toFixed(1)},${(padT+innerH).toFixed(1)} ${linePoints} ${xFor(n-1).toFixed(1)},${(padT+innerH).toFixed(1)}`;

  let grid = '';
  for(let g=0; g<=4; g++){
    const y = padT + innerH - (g/4)*innerH;
    const val = (g/4)*maxVal;
    grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${width-padR}" y2="${y.toFixed(1)}" stroke="#E5E0D2" stroke-width="1"/>`;
    grid += `<text x="${padL-8}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" font-family="IBM Plex Mono,monospace" fill="#5B6459">${Math.round(val)}</text>`;
  }
  const labelStep = Math.max(1, Math.ceil(n/8));
  let xLabels = '';
  points.forEach((p,i)=>{
    if(i%labelStep===0 || i===n-1){
      xLabels += `<text x="${xFor(i).toFixed(1)}" y="${height-10}" text-anchor="middle" font-size="8.5" font-family="IBM Plex Mono,monospace" fill="#5B6459">${svgEscape(p.date.slice(5))}</text>`;
    }
  });
  const dots = points.map((p,i)=>`<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.value).toFixed(1)}" r="3" fill="#2E6B4C"><title>${svgEscape(p.date)}: ${money(p.value)}</title></circle>`).join('');

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:${width}px;display:block;">
    ${grid}
    <polygon points="${areaPoints}" fill="#2E6B4C" opacity="0.12"/>
    <polyline points="${linePoints}" fill="none" stroke="#2E6B4C" stroke-width="2.5"/>
    ${dots}
    ${xLabels}
  </svg>`;
}
function buildSalesMindMapData(label, totals, byPlatform, byCashier, visaTotal, mastercardTotal, madaTotal){
  const pct = v => totals.sales>0 ? (v/totals.sales*100) : 0;
  const platformChildren = byPlatform.filter(p=>p.val>0).slice(0,5).map(p=>({label:p.label, value:p.val}));
  const cashierChildren = byCashier.filter(c=>c.val>0).slice(0,5).map(c=>({label:c.label, value:c.val}));
  const networkChildren = [
    {label:'مدى/شبكات', value:madaTotal}, {label:'فيزا', value:visaTotal}, {label:'ماستركارد', value:mastercardTotal}
  ].filter(x=>x.value>0);
  const mm = state.mindMap || {hidden:[], custom:[], compact:false};
  let children = [
    {label:'نقدي', value:totals.cash, color:'#173C2A', pct:pct(totals.cash), children: (!mm.compact && cashierChildren.length)? cashierChildren : undefined},
    {label:'شبكات', value:totals.span, color:'#2E6B4C', pct:pct(totals.span), children: mm.compact? undefined : networkChildren},
    {label:'توصيل (آجل)', value:totals.credit, color:'#B8862E', pct:pct(totals.credit), children: mm.compact? undefined : platformChildren},
    {label:'مصروفات', value:totals.exp, color:'#A6402F', pct:pct(totals.exp)},
    {label:'صافي المبيعات', value:totals.net, color:'#1F4A8A', pct:pct(totals.net)},
  ];
  children = children.filter(c=> !(mm.hidden||[]).includes(c.label));
  (mm.custom||[]).forEach(c=> children.push({label:c.label, value:num(c.value), color:c.color||'#7A3FA3', isCustom:true, customId:c.id}));
  return { label, value: totals.sales, children };
}
function renderDashboard(){

  const filterPanelHtml = `

  </div>`;
  if(rows.length===0) return `<div class="section-eyebrow">Dashboard</div><div class="panel-title" style="margin-bottom:16px;">لوحة المؤشرات</div>${filterPanelHtml}<div class="panel"><div class="empty">لا توجد بيانات كافية لعرض المؤشرات بعد.</div></div>`;
  const totals = rows.reduce((acc,e)=>{
    const f = finalizedTotalsForEntry(e);
    acc.cash+=f.cash; acc.span+=f.totalSpan; acc.credit+=f.totalCredit;
    acc.sales+=f.totalSales; acc.net+=(f.totalSales-f.totalExpenses); acc.exp+=f.totalExpenses;
    acc.actualSales += computeTotals(e).totalSales;
    acc.anyComputer = acc.anyComputer || f.hasComputer;
    return acc;
  },{cash:0,span:0,credit:0,sales:0,net:0,exp:0,actualSales:0,anyComputer:false});
  const pct = (v)=> totals.sales>0 ? (v/totals.sales*100) : 0;

  const byPlatform = DELIVERY_PLATFORMS.map(p=>({label:p.label, val: rows.reduce((s,e)=>s+finalizedTotalsForEntry(e).platformVals[p.key],0)})).sort((a,b)=>b.val-a.val);
  const maxPlatform = Math.max(1, ...byPlatform.map(x=>x.val));

  const byCashierMap = {};
  rows.forEach(e=>{ const f=finalizedTotalsForEntry(e); byCashierMap[e.cashierName]=(byCashierMap[e.cashierName]||0)+f.totalSales; });
  const byCashier = Object.entries(byCashierMap).map(([label,val])=>({label,val})).sort((a,b)=>b.val-a.val);
  const maxCashier = Math.max(1, ...byCashier.map(x=>x.val));

  const visaTotal = round2(rows.reduce((s,e)=>s+num(e.visa),0));
  const mastercardTotal = round2(rows.reduce((s,e)=>s+num(e.mastercard),0));
  const madaTotal = round2(rows.reduce((s,e)=>s+num(e.span),0));
  const mindMapLabel = state.filters.branch || 'كل الفروع';
  const mindMapTree = buildSalesMindMapData(mindMapLabel, totals, byPlatform, byCashier, visaTotal, mastercardTotal, madaTotal);

  const byDayAll = {};
  rows.forEach(e=>{ const f=finalizedTotalsForEntry(e); byDayAll[e.date] = round2((byDayAll[e.date]||0) + f.totalSales); });
  let timelinePoints = Object.entries(byDayAll).map(([date,value])=>({date,value})).sort((a,b)=>a.date.localeCompare(b.date));
  const timelineTruncated = timelinePoints.length>30;
  if(timelineTruncated) timelinePoints = timelinePoints.slice(-30);
  const avgDaily = timelinePoints.length? round2(timelinePoints.reduce((s,p)=>s+p.value,0)/timelinePoints.length) : 0;
  const bestDay = timelinePoints.reduce((m,p)=> (!m || p.value>m.value) ? p : m, null);
  const worstDay = timelinePoints.reduce((m,p)=> (!m || p.value<m.value) ? p : m, null);
  const halfN = Math.floor(timelinePoints.length/2);
  const firstHalfAvg = halfN>0 ? timelinePoints.slice(0,halfN).reduce((s,p)=>s+p.value,0)/halfN : 0;
  const secondHalfAvg = (timelinePoints.length-halfN)>0 ? timelinePoints.slice(halfN).reduce((s,p)=>s+p.value,0)/(timelinePoints.length-halfN) : 0;
  const trendPct = firstHalfAvg>0 ? ((secondHalfAvg-firstHalfAvg)/firstHalfAvg*100) : 0;

function attachMindMapDragEvents(){
  const svgEl = document.getElementById('mindMapSvg');
  if(!svgEl) return;
  function toSvgPoint(evt){
    const pt = svgEl.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    const ctm = svgEl.getScreenCTM();
    if(!ctm) return {x:0,y:0};
    const p = pt.matrixTransform(ctm.inverse());
    return {x:p.x, y:p.y};
  }
  svgEl.querySelectorAll('.mm-draggable').forEach(g=>{
    let drag = null;
    g.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const m = (g.getAttribute('transform')||'translate(0,0)').match(/translate\(([-\d.]+),\s*([-\d.]+)\)/);
      const startX = m? parseFloat(m[1]) : 0, startY = m? parseFloat(m[2]) : 0;
      const p = toSvgPoint(e);
      drag = {offsetX: p.x-startX, offsetY: p.y-startY};
      g.style.cursor='grabbing';
      g.setPointerCapture(e.pointerId);
    });
    g.addEventListener('pointermove', (e)=>{
      if(!drag) return;
      const p = toSvgPoint(e);
      const nx = p.x-drag.offsetX, ny = p.y-drag.offsetY;
      g.setAttribute('transform', `translate(${nx},${ny})`);
      const line = document.getElementById('mmline-'+g.dataset.mmnode);
      if(line){ line.setAttribute('x2', nx); line.setAttribute('y2', ny); }
    });
    const endDrag = async (e)=>{
      if(!drag) return;
      const p = toSvgPoint(e);
      const nx = round2(p.x-drag.offsetX), ny = round2(p.y-drag.offsetY);
      if(!state.mindMap.positions) state.mindMap.positions = {};
      state.mindMap.positions[g.dataset.mmnode] = {x:nx, y:ny};
      drag = null; g.style.cursor='grab';
      await sset('ns_mindmap_settings', state.mindMap);
    };
    g.addEventListener('pointerup', endDrag);
    g.addEventListener('pointercancel', endDrag);
  });
}

const SHIFT_MAP_FIELDS = [

  {key:'expenses', label:'مصروفات'}, ...DELIVERY_PLATFORMS.map(p=>({key:p.key, label:p.label}))
];
const PLATFORM_ALIASES = [
  {key:'hungerstation', words:['HUNGERSTATION','HUNGER STATION']},
  {key:'toyou', words:['TOYOU','TO YOU']},
  {key:'mrsool', words:['MRSOOL']},

  {key:'chefz', words:['CHEFZ']},
  {key:'ninja', words:['NINJA']},
];
const PAYMENT_ALIASES = [
  {key:'visa', words:['VISA']},
  {key:'mastercard', words:['MASTER']},
  {key:'span', words:['MADA','SPAN']},
  {key:'otherCreditSales', words:['CREDIT']},
  {key:'cash', words:['CASH']},
];
function normalizeLabel(s){ return (s||'').toString().toUpperCase().replace(/[^A-Z0-9\u0600-\u06FF]+/g,' ').trim(); }
function classifyChannelLabel(label){
  const norm = normalizeLabel(label);
  for(const p of PLATFORM_ALIASES){ if(p.words.some(w=>norm.includes(w))) return {kind:'platform', key:p.key}; }
  for(const p of PAYMENT_ALIASES){ if(p.words.some(w=>norm.includes(w))) return {kind:'payment', key:p.key}; }
  return {kind:'unknown', key:null};
}
function fieldLabelFor(key){
  const f = SHIFT_MAP_FIELDS.find(x=>x.key===key);
  if(f) return f.label;
  return key==='otherCreditSales' ? 'مبيعات آجلة/ائتمان أخرى' : key;
}
function matchBranchInLabel(label){
  const norm = normalizeLabel(label);
  for(const b of state.branches){
    const parts = b.split(/[-–]/).map(x=>normalizeLabel(x)).filter(x=>x.length>=3);
    for(const part of parts){
      const firstWord = part.split(' ')[0];
      if(firstWord && firstWord.length>=3 && norm.includes(firstWord)) return b;
    }
  }
  return null;
}
function detectBranchFromLabel(label, fallback){ return matchBranchInLabel(label) || fallback; }
async function readFileRaw(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
  const headers = (rows[0]||[]).map(h=>(h||'').toString());
  const dataRows = rows.slice(1).filter(r=> r && r.some(c=> c!=='' && c!==null && c!==undefined));
  return {name:file.name, headers, dataRows};
}
function guessHeaderIndex(headers, keywords){
  for(let i=0;i<headers.length;i++){
    const h = headers[i].toLowerCase();
    if(keywords.some(k=>h.includes(k))) return i;
  }
  return -1;
}

      });

function buildChannelPaymentPreview(wiz){
  const labelIdx = wiz.mapping.labelCol!=='' ? parseInt(wiz.mapping.labelCol,10) : -1;
  const valueIdx = wiz.mapping.valueCol!=='' ? parseInt(wiz.mapping.valueCol,10) : -1;
  const returnIdx = wiz.mapping.returnCol && wiz.mapping.returnCol!=='' ? parseInt(wiz.mapping.returnCol,10) : -1;
  if(labelIdx<0 || valueIdx<0) return {error:'الرجاء تحديد عمود التسمية وعمود القيمة قبل المعاينة', rawRows:[], byBranch:{}, total:0};
  const rawRows = [];
  wiz.parsedFiles.forEach(f=>{
    f.dataRows.forEach(r=>{
      const label = (r[labelIdx]||'').toString().trim();
      if(!label) return;
      const value = num(r[valueIdx]);
      const ret = returnIdx>=0 ? num(r[returnIdx]) : 0;
      let cls = classifyChannelLabel(label);
      const matchedBranch = matchBranchInLabel(label);
      if(cls.kind==='unknown' && matchedBranch){ cls = {kind:'payment', key:'cash', note:'مبيعات مباشرة للفرع (تم تصنيفها كنقدي)'}; }
      const branch = wiz.branchMode==='detect' ? (matchedBranch || wiz.branch) : wiz.branch;
      rawRows.push({label, value, ret, cls, branch});
    });
  });
  const total = rawRows.reduce((s,r)=>s+r.value,0);
  const byBranch = {};
  rawRows.forEach(r=>{
    if(!byBranch[r.branch]){
      byBranch[r.branch] = {cash:0,span:0,visa:0,mastercard:0,otherCreditSales:0,discountReturn:0,expenses:0};
      DELIVERY_PLATFORMS.forEach(p=>{ byBranch[r.branch][p.key]=0; });
    }
    if(r.cls.kind==='platform' || r.cls.kind==='payment') byBranch[r.branch][r.cls.key] += r.value;
    byBranch[r.branch].discountReturn += r.ret;
  });
  return {rawRows, total, byBranch};
}


/* ============ DAILY RECONCILIATION REPORT ============ */
function dayAggregate(date, branch){
  const dayShifts = state.entries.filter(e=>e.date===date && e.branch===branch);
  const extForDay = state.externalSales.filter(e=>e.date===date && e.branch===branch);
  const bankRec = state.bankSettlements.find(b=>b.date===date && b.branch===branch);
  const bankAmount = bankRec ? num(bankRec.amount) : 0;
  const gt = dayShifts.reduce((acc,e)=>{
    const t = computeTotals(e);
    acc.cash+=num(e.cash); acc.span+=num(e.span); acc.visa+=num(e.visa); acc.mastercard+=num(e.mastercard);
    acc.totalSpan+=t.totalSpan; acc.credit+=t.totalCredit; acc.discountReturn+=num(e.discountReturn);
    acc.expenses+=num(e.expenses); acc.totalSales+=t.totalSales; acc.exsh+=num(e.exShortage);
    DELIVERY_PLATFORMS.forEach(p=> acc[p.key]=(acc[p.key]||0)+num(e[p.key]));
    return acc;
  }, {cash:0,span:0,visa:0,mastercard:0,totalSpan:0,credit:0,discountReturn:0,expenses:0,totalSales:0,exsh:0});
  const extTotals = extForDay.reduce((acc,e)=>{
    const t = computeTotals(e);
    acc.cash+=num(e.cash); acc.totalSpan+=t.totalSpan; acc.credit+=t.totalCredit; acc.expenses+=num(e.expenses);
    acc.totalSales+=t.totalSales;
    return acc;
  }, {cash:0,totalSpan:0,credit:0,expenses:0,totalSales:0});
  const bySystem = {};
  extForDay.forEach(e=>{
    const key = e.system||'other';
    if(!bySystem[key]) bySystem[key] = {cash:0,totalSpan:0,credit:0,expenses:0,totalSales:0};
    const t = computeTotals(e);
    bySystem[key].cash+=num(e.cash); bySystem[key].totalSpan+=t.totalSpan; bySystem[key].credit+=t.totalCredit;
    bySystem[key].expenses+=num(e.expenses); bySystem[key].totalSales+=t.totalSales;
  });
  return {dayShifts, extForDay, bankAmount, gt, extTotals, bySystem};
}

  const rows = state.externalSales.filter(e=>e.date===date && e.branch===branch && e.cashierName===cashierName && e.shift===shift);

function finalizedTotalsForEntry(e){

  // مدخل الكاشير نفسه — سجلات مصادقة الأنظمة الخارجية (تطبيقات التوصيل) لا تحلّ محلها هنا أبداً؛
  // هي مخصّصة فقط لحساب الانحراف (الفرق) في التقرير اليومي، راجع computerTotalForShift.
  const t = computeTotals(e);
  const platformVals = {}; DELIVERY_PLATFORMS.forEach(p=> platformVals[p.key]=num(e[p.key]));
  const hasComputer = state.externalSales.some(x=>x.date===e.date && x.branch===e.branch && x.cashierName===e.cashierName && x.shift===e.shift);
  return {cash:num(e.cash), totalSpan:t.totalSpan, totalCredit:t.totalCredit, totalSales:t.totalSales, totalExpenses:t.totalExpenses, platformVals, hasComputer};
}

function finalizedDayTotalFor(date, branch){
  // مبيعات اليوم المعتمدة تُبنى من مدخلات الكاشير دائمًا — أرقام الأنظمة الخارجية (تطبيقات
  // التوصيل) لا تستبدلها، وتُستخدم فقط لحساب الفرق/الانحراف في نفس هذا التقرير.
  return state.entries.filter(e=>e.date===date && e.branch===branch).reduce((sum,e)=> sum + computeTotals(e).totalSales, 0);
}
function renderDailyRangeBody(df){
  const branch = df.branch;
  const allDates = [];
  if(df.from && df.to){
    let d = new Date(df.from+'T00:00:00');
    const end = new Date(df.to+'T00:00:00');
    let guard = 0;
    while(d<=end && guard<400){
      allDates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
      d.setDate(d.getDate()+1); guard++;
    }
  }
  const rows = allDates.map(date=>{
    const dayEntries = state.entries.filter(e=>e.date===date && e.branch===branch);
    if(dayEntries.length===0) return null;
    const {gt, extTotals, extForDay} = dayAggregate(date, branch);
    const actualTotal = gt.totalSales + gt.exsh;
    const finalTotal = finalizedDayTotalFor(date, branch);
    const systemsUsed = [...new Set(extForDay.map(e=>{ const sys=INTEGRATION_SYSTEMS.find(x=>x.key===e.system); return sys?sys.name:(e.system||'أخرى'); }))];
    return {date, actualTotal, finalTotal, extTotal: extTotals.totalSales, hasExt: extForDay.length>0, diff: actualTotal-extTotals.totalSales, systemsUsed};
  }).filter(Boolean);

  const gTotal = rows.reduce((acc,r)=>{ acc.actual+=r.actualTotal; acc.final+=r.finalTotal; if(r.hasExt) acc.ext+=r.extTotal; return acc; },{actual:0,final:0,ext:0});

  return `
  <div class="panel">
    <div class="panel-title">مطابقة يومية عبر النطاق المحدد (${rows.length} يوم له بيانات)</div>
    <div class="notice">اسحب بيانات فترة كاملة (شهر مثلًا) وطابقها يومًا بيوم دفعة واحدة. اضغط «عرض التفاصيل» على أي يوم للانتقال لتقريره المفصّل. عمود «المعتمد النهائي» مبني دائمًا على مبيعات الكاشير الفعلية؛ رقم الأنظمة الخارجية (تطبيقات التوصيل) يظهر بعمود «الأنظمة الخارجية» وعمود «الفرق» للمقارنة فقط، ولا يُستبدل به إجمالي المبيعات.</div>
    <div class="table-wrap"><table style="min-width:960px">
      <thead><tr><th>التاريخ</th><th>اليوم</th><th>الفعلي</th><th>المعتمد النهائي</th><th>الأنظمة الخارجية</th><th>الأنظمة المصدر</th><th>الفرق</th><th>الحالة</th><th>—</th></tr></thead>
      <tbody>
      ${rows.length===0? `<tr><td colspan="9" class="empty">لا توجد بيانات كاشير مسجّلة ضمن هذا النطاق لهذا الفرع</td></tr>` : rows.map(r=>{
        const ok = r.hasExt && Math.abs(r.diff)<0.01;
        return `<tr>
          <td>${r.date}</td><td>${dayNameAr(r.date)}</td><td>${money(r.actualTotal)}</td><td class="total-col">${money(r.finalTotal)}</td>
          <td>${r.hasExt?money(r.extTotal):'—'}</td>
          <td class="name-cell">${r.systemsUsed.join('، ')||'—'}</td>
          <td style="font-weight:700;color:${!r.hasExt?'var(--ink-soft)':(ok?'var(--green)':'var(--red)')}">${r.hasExt?money(r.diff):'—'}</td>
          <td>${!r.hasExt?'<span class="status-pill">بلا مصادقة</span>':(ok?'<span class="status-pill on">✓ مطابق</span>':'<span class="status-pill" style="background:#FBEAE7;color:var(--red);">⚠ فرق</span>')}</td>
          <td><button class="btn btn-ghost btn-sm" data-viewday="${r.date}">عرض التفاصيل</button></td>
        </tr>`;
      }).join('')}
      </tbody>
      ${rows.length? `<tfoot><tr style="font-weight:800;background:var(--paper-alt);">
        <td colspan="2">G - Total</td><td>${money(gTotal.actual)}</td><td>${money(gTotal.final)}</td><td>${money(gTotal.ext)}</td><td></td>
        <td colspan="3">${money(gTotal.actual-gTotal.ext)}</td>
      </tr></tfoot>`:''}
    </table></div>
  </div>`;
}
async function archiveCurrentDailyReport(date, branch){
  const u = state.currentUser;
  const {dayShifts, bankAmount, gt} = dayAggregate(date, branch);
  const finalTotal = finalizedDayTotalFor(date, branch);
  const snapshot = {
    cash: gt.cash, span: gt.totalSpan, visa: gt.visa, mastercard: gt.mastercard, credit: gt.credit,
    discountReturn: gt.discountReturn, expenses: gt.expenses, actualTotal: gt.totalSales,
    finalTotal, bankAmount, shiftsCount: dayShifts.length,
    cashiers: [...new Set(dayShifts.map(e=>e.cashierName))]
  };
  const existing = state.reportArchive.find(a=>a.date===date && a.branch===branch);
  if(existing){
    existing.snapshot = snapshot; existing.archivedAt = new Date().toISOString(); existing.archivedBy = u.username;
  } else {
    state.reportArchive.push({id:uid(), date, branch, snapshot, archivedAt:new Date().toISOString(), archivedBy:u.username});
  }
  await sset('ns_report_archive', state.reportArchive);
  render();
}
function initArchiveFilter(u){
  if(!state.archiveFilter) state.archiveFilter = {branch: u.branch || state.branches[0] || '', mode:'all', date: todayISO(), from:'', to:''};
  return state.archiveFilter;
}

  }));

  document.querySelectorAll('[data-exsh]').forEach(inp=>{

    if(entry){ delete entry.exShortage; await sset('ns_entries', state.entries); render(); }
  }));

  document.querySelectorAll('[data-platformoff]').forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const platform = inp.dataset.platformoff;
      const val = round2(inp.value);
      let rec = state.platformReports.find(r=>r.date===df.date && r.branch===df.branch && r.platform===platform);
      if(rec){ rec.value = val; }
      else{ state.platformReports.push({id:uid(), date:df.date, branch:df.branch, platform, value:val, createdBy:state.currentUser.username, createdAt:new Date().toISOString()}); }
      await sset('ns_platform_reports', state.platformReports);
      render();
    });
  });

  const saveBankBtn = document.getElementById('saveBankBtn');
  if(saveBankBtn) saveBankBtn.addEventListener('click', async ()=>{
    const amount = num(document.getElementById('bank_amount').value);
    const {date, branch} = df;
    let rec = state.bankSettlements.find(b=>b.date===date && b.branch===branch);
    if(rec){ rec.amount = amount; }
    else{ state.bankSettlements.push({id:uid(), date, branch, amount, createdBy:state.currentUser.username, createdAt:new Date().toISOString()}); }
    await sset('ns_bank_settlements', state.bankSettlements);
    render();
  });

  wireToolbar('printDailyBtn','exportDailyBtn', ()=>{
    if(df.mode==='single'){
      const {date, branch} = df;
      const dayShifts = state.entries.filter(e=>e.date===date && e.branch===branch);
      const headers = ['الوردية','الكاشير','نقدي','شبكات','فيزا','ماستر','التوصيل','خصم/مرتجع','مصروفات','إجمالي المبيعات','فرق (فعلي-كمبيوتر)','الإجمالي النهائي'];
      const rows = dayShifts.map(e=>{
        const t = computeTotals(e);
        const compTotal = computerTotalForShift(e.date, e.branch, e.cashierName, e.shift);
        const autoDiff = compTotal!==null ? (t.totalSales - compTotal) : null;
        const exsh = (typeof e.exShortage === 'number') ? e.exShortage : (autoDiff!==null ? autoDiff : 0);
        const final = t.totalSales;
        return [e.shift==='morning'?'صباح':'مساء', e.cashierName, num(e.cash), num(e.span), num(e.visa), num(e.mastercard), t.totalCredit, num(e.discountReturn), num(e.expenses), t.totalSales, exsh, final];
      });
      downloadCSV(`تقرير-يومي-${branch}-${date}.csv`, headers, rows);
    } else if(df.mode==='range'){
      const branch = df.branch;
      const allDates = [];
      let d = new Date(df.from+'T00:00:00'); const end = new Date(df.to+'T00:00:00'); let guard=0;
      while(d<=end && guard<400){ allDates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); d.setDate(d.getDate()+1); guard++; }
      const headers = ['التاريخ','اليوم','الفعلي','المعتمد النهائي','الأنظمة الخارجية','الأنظمة المصدر','الفرق'];
      const rows = allDates.map(date=>{
        const dayEntries = state.entries.filter(e=>e.date===date && e.branch===branch);
        if(dayEntries.length===0) return null;
        const {gt, extTotals, extForDay} = dayAggregate(date, branch);
        const actualTotal = gt.totalSales+gt.exsh;
        const finalTotal = finalizedDayTotalFor(date, branch);
        const systemsUsed = [...new Set(extForDay.map(e=>{ const sys=INTEGRATION_SYSTEMS.find(x=>x.key===e.system); return sys?sys.name:(e.system||'أخرى'); }))].join('، ');
        return [date, dayNameAr(date), actualTotal, finalTotal, extForDay.length?extTotals.totalSales:'', systemsUsed, extForDay.length?(actualTotal-extTotals.totalSales):''];
      }).filter(Boolean);
      downloadCSV(`مطابقة-شهرية-${branch}.csv`, headers, rows);
    } else {
      doPrint();
    }
  });

  const archiveBtn = document.getElementById('archiveReportBtn');
  if(archiveBtn) archiveBtn.addEventListener('click', ()=> archiveCurrentDailyReport(df.date, df.branch));
}

async function saveQuickBatch(){
  const qb = state.quickBatch;
  const u = state.currentUser;
  const validRows = qb.rows.filter(r=>r.cashierName);
  if(validRows.length===0){ alert('الرجاء اختيار اسم الكاشير في صف واحد على الأقل'); return; }
  const newEntries = validRows.map(r=>({
    id: uid(), date: qb.date, branch: qb.branch, shift: r.shift, system: qb.system,
    cashierName: r.cashierName, cash: num(r.cash), span: num(r.span), visa: num(r.visa), mastercard: num(r.mastercard),
    discountReturn: num(r.discountReturn), expenses: num(r.expenses), otherCreditSales: num(r.credit),
    createdBy: u.username, createdAt: new Date().toISOString()
  }));
  state.externalSales = state.externalSales.concat(newEntries);
  await sset('ns_external_sales', state.externalSales);
  if(qb.bankAmount){
    let rec = state.bankSettlements.find(b=>b.date===qb.date && b.branch===qb.branch);
    if(rec){ rec.amount = num(qb.bankAmount); }
    else{ state.bankSettlements.push({id:uid(), date:qb.date, branch:qb.branch, amount:num(qb.bankAmount), createdBy:u.username, createdAt:new Date().toISOString()}); }
    await sset('ns_bank_settlements', state.bankSettlements);
  }
  await logImportOperation('file', 'إدخال سريع جماعي ('+validRows.length+' كاشير)', qb.branch, newEntries.length);
  state.quickBatch = null;
  render();
}
function attachQuickBatchEvents(){
  const qb = state.quickBatch;
  if(!qb) return;
  const sysEl = document.getElementById('qb_system'); if(sysEl) sysEl.addEventListener('change', ()=>{ qb.system = sysEl.value; });
  const dateEl = document.getElementById('qb_date'); if(dateEl) dateEl.addEventListener('change', ()=>{ qb.date = dateEl.value; render(); });
  const branchEl = document.getElementById('qb_branch'); if(branchEl) branchEl.addEventListener('change', ()=>{ qb.branch = branchEl.value; render(); });
  const bankEl = document.getElementById('qb_bank'); if(bankEl) bankEl.addEventListener('input', ()=>{ qb.bankAmount = num(bankEl.value); });

  document.querySelectorAll('[data-qb]').forEach(el=>{
    const evt = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      const row = qb.rows.find(r=>r.id===el.dataset.qb);
      if(!row) return;
      const f = el.dataset.f;
      row[f] = (f==='cashierName'||f==='shift') ? el.value : num(el.value);
    });
  });
  document.querySelectorAll('[data-qbdel]').forEach(b=>b.addEventListener('click', ()=>{
    qb.rows = qb.rows.filter(r=>r.id!==b.dataset.qbdel); render();
  }));
  const addRowBtn = document.getElementById('qbAddRowBtn');
  if(addRowBtn) addRowBtn.addEventListener('click', ()=>{
    qb.rows.push({id:uid(), cashierName:'', shift:'morning', cash:0, span:0, visa:0, mastercard:0, discountReturn:0, expenses:0, credit:0});
    render();
  });
  const saveAllBtn = document.getElementById('qbSaveAllBtn');
  if(saveAllBtn) saveAllBtn.addEventListener('click', saveQuickBatch);
}
function inferShiftFromHour(hour){
  if(hour===null || hour===undefined || isNaN(hour)) return 'morning';
  const h = Math.floor(num(hour));
  return (h>=5 && h<17) ? 'morning' : 'evening';
}
function buildSmartChannelEntries(rawFiles, mapping, defaultBranch, branchMode){
  const labelIdx = mapping.labelCol!=='' && mapping.labelCol!==undefined ? parseInt(mapping.labelCol,10) : -1;
  const valueIdx = mapping.valueCol!=='' && mapping.valueCol!==undefined ? parseInt(mapping.valueCol,10) : -1;
  const hourIdx = mapping.hourCol!=='' && mapping.hourCol!==undefined ? parseInt(mapping.hourCol,10) : -1;
  const creatorIdx = mapping.creatorCol!=='' && mapping.creatorCol!==undefined ? parseInt(mapping.creatorCol,10) : -1;
  if(labelIdx<0 || valueIdx<0) return {error:'الرجاء تحديد عمود التسمية وعمود القيمة على الأقل', buckets:{}, rawRows:[]};

  const rawRows = [];
  rawFiles.forEach(f=>{
    f.dataRows.forEach(r=>{
      const label = (r[labelIdx]||'').toString().trim();
      if(!label) return;
      const value = round2(r[valueIdx]);
      const hour = hourIdx>=0 ? num(r[hourIdx]) : null;
      const creator = creatorIdx>=0 ? (r[creatorIdx]||'').toString().trim() : '';
      const shift = inferShiftFromHour(hour);
      let cls = classifyChannelLabel(label);
      const matchedBranch = matchBranchInLabel(label);
      if(cls.kind==='unknown' && matchedBranch){ cls = {kind:'payment', key:'cash'}; }
      const branch = branchMode==='detect' ? (matchedBranch || defaultBranch) : defaultBranch;
      rawRows.push({label, value, hour, creator, shift, cls, branch});
    });
  });

  const buckets = {};
  rawRows.forEach(r=>{
    const cashierKey = r.creator || 'غير محدد (بدون عمود منشئ)';
    const bucketKey = r.branch+'|'+r.shift+'|'+cashierKey;
    if(!buckets[bucketKey]){
      buckets[bucketKey] = {branch:r.branch, shift:r.shift, cashierName:cashierKey, cash:0,span:0,visa:0,mastercard:0,otherCreditSales:0,discountReturn:0,expenses:0};
      DELIVERY_PLATFORMS.forEach(p=>{ buckets[bucketKey][p.key]=0; });
    }
    if(r.cls.kind==='platform' || r.cls.kind==='payment') buckets[bucketKey][r.cls.key] += r.value;
  });
  Object.values(buckets).forEach(b=>{
    ['cash','span','visa','mastercard','otherCreditSales'].forEach(k=> b[k]=round2(b[k]));
    DELIVERY_PLATFORMS.forEach(p=> b[p.key]=round2(b[p.key]));
  });

  return {rawRows, buckets, error:null};
}

function bulkImportPreviewHtml(){
  const bi = state.bulkImport;
  const p = bi.preview;
  if(!p) return '';
  if(p.error) return `<div class="error-box">${p.error}</div>`;
  if(p.parsed.length===0) return `<div class="empty">لم يتم العثور على صفوف صالحة (تحقق من الأعمدة المحددة).</div>`;
  const successPct = p.total>0 ? ((p.total-p.skipped)/p.total*100) : 0;
  const errorPct = p.total>0 ? (p.skipped/p.total*100) : 0;
  const totals = p.parsed.reduce((acc,e)=>{ const t=computeTotals(e); acc.sales+=t.totalSales; return acc; },{sales:0});
  const shiftsCount = new Set(p.parsed.map(e=>e.date+'|'+e.branch+'|'+e.shift+'|'+e.cashierName)).size;
  const isSmart = bi.shape==='smart';
  return `
  <div class="notice">${isSmart ? `تم تحليل ${p.total} صف من الملف، وتجميعها في <b>${p.parsed.length}</b> سجل مصادقة (${shiftsCount} وردية/كاشير مختلف) — ${p.skipped} صف لم يُصنّف (غير معروف).` : `تم العثور على <b>${p.parsed.length}</b> صف صالح (${shiftsCount} وردية) من أصل ${p.total}، تم تجاهل ${p.skipped} صف بدون تاريخ صحيح.`}</div>

    <div class="bar-row"><div class="bar-label">صفوف بها خطأ/متجاهلة</div><div class="bar-track"><div class="bar-fill" style="width:${errorPct.toFixed(1)}%;background:var(--red);"></div></div><div class="bar-val">${p.skipped} (${errorPct.toFixed(0)}%)</div></div>

  ${externalTableHtml(p.parsed.slice(0,80), false)}

  <div style="margin-top:16px;"><button class="btn btn-primary" id="biConfirmBtn" style="width:auto;padding-inline:26px;">تأكيد استيراد (${p.parsed.length} سجل)</button></div>`;
}
async function confirmBulkImport(){
  const bi = state.bulkImport;
  const u = state.currentUser;
  if(!bi.preview || bi.preview.parsed.length===0) return;
  bi.preview.parsed.forEach(e=>{
    if(!e.branch) e.branch = bi.branch;
    e.system = bi.system;
    e.id = uid(); e.createdBy = u.username; e.createdAt = new Date().toISOString();
    if(!e.cashierName) e.cashierName = 'استيراد دفعة';
    if(u.role==='admin' && e.branch && !state.branches.includes(e.branch)) state.branches.push(e.branch);
  });
  state.externalSales = state.externalSales.concat(bi.preview.parsed);
  await sset('ns_external_sales', state.externalSales);
  await sset('ns_branches', state.branches);
  await logImportOperation(bi.mode==='file'?'file':'sheet', bi.sourceLabel, bi.branch, bi.preview.parsed.length);
  state.bulkImport.preview = null;
  render();
}

async function finishReconciliation(){
  const rw = state.recWizard;
  const u = state.currentUser;
  if(!rw.cashierName){ alert('الرجاء إكمال المرحلة الأولى أولًا (اختيار الكاشير)'); return; }
  const entry = {
    id: uid(), date: rw.date, branch: rw.branch, shift: rw.shift, system: rw.system,
    cashierName: rw.cashierName, cash: num(rw.payments.cash), span: num(rw.payments.span),
    visa: num(rw.payments.visa), mastercard: num(rw.payments.mastercard), discountReturn:0, expenses:0,
    createdBy: u.username, createdAt: new Date().toISOString()
  };
  DELIVERY_PLATFORMS.forEach(p=>{ entry[p.key] = rw.platformRows.filter(r=>r.key===p.key).reduce((s,r)=>s+num(r.value),0); });
  const otherSum = rw.platformRows.filter(r=>r.key==='_other').reduce((s,r)=>s+num(r.value),0);
  if(otherSum) entry.otherCreditSales = otherSum;
  state.externalSales.push(entry);
  await sset('ns_external_sales', state.externalSales);
  const entryTotal = computeTotals(entry).totalSales;
  const diff = round2(num(rw.externalShiftTotal) - entryTotal);
  const matchLabel = Math.abs(diff)<1 ? 'مطابق تمامًا' : 'فرق: '+money(diff);
  await logImportOperation('file', `مصادقة 3 مراحل — ${rw.cashierName} (${rw.shift==='morning'?'صباح':'مساء'}) — ${matchLabel}`, rw.branch, 1);
  state.recWizard = null;
  render();
}
function attachReconciliationWizardEvents(){
  const rw = state.recWizard;
  if(!rw) return;

  if(rw.stage===1){
    const sysEl=document.getElementById('rw_system'); if(sysEl) sysEl.addEventListener('change', ()=>{ rw.system=sysEl.value; });
    const dateEl=document.getElementById('rw_date'); if(dateEl) dateEl.addEventListener('change', ()=>{ rw.date=dateEl.value; render(); });
    const branchEl=document.getElementById('rw_branch'); if(branchEl) branchEl.addEventListener('change', ()=>{ rw.branch=branchEl.value; rw.cashierName=''; render(); });
    const cashierEl=document.getElementById('rw_cashier'); if(cashierEl) cashierEl.addEventListener('change', ()=>{ rw.cashierName=cashierEl.value; render(); });
    const shiftEl=document.getElementById('rw_shift'); if(shiftEl) shiftEl.addEventListener('change', ()=>{ rw.shift=shiftEl.value; render(); });
    const extEl=document.getElementById('rw_exttotal'); if(extEl) extEl.addEventListener('input', ()=>{ rw.externalShiftTotal=extEl.value; });
    const next1=document.getElementById('rwNext1'); if(next1) next1.addEventListener('click', ()=>{
      if(!rw.cashierName){ alert('الرجاء اختيار اسم الكاشير'); return; }
      if(extEl) rw.externalShiftTotal = num(extEl.value);
      rw.stage=2; render();
    });
  }

  if(rw.stage===2){
    const bind=(id,field)=>{ const el=document.getElementById(id); if(el) el.addEventListener('input', ()=>{
      rw.payments[field]=num(el.value);
      const d=document.getElementById('rwPaySumDisplay');
      if(d) d.textContent=money(num(rw.payments.cash)+num(rw.payments.span)+num(rw.payments.visa)+num(rw.payments.mastercard));
    }); };
    bind('rw_p_cash','cash'); bind('rw_p_span','span'); bind('rw_p_visa','visa'); bind('rw_p_mastercard','mastercard');
    const importBtn=document.getElementById('rwPayImportBtn');
    if(importBtn) importBtn.addEventListener('click', async ()=>{
      const fileInput = document.getElementById('rw_p_file');
      const f = fileInput.files[0];
      if(!f){ alert('اختر ملفًا أولًا'); return; }
      try{
        const raw = await readFileRaw(f);
        const labelIdx = guessHeaderIndex(raw.headers, ['طريقة','دفع','payment','method','name','عميل']);
        const valueIdx = guessHeaderIndex(raw.headers, ['قيمة','اجمالي','إجمالي','value','total']);
        if(labelIdx<0||valueIdx<0){ document.getElementById('rwPayImportMsg').textContent='تعذّر تحديد الأعمدة تلقائيًا، أدخل القيم يدويًا.'; return; }
        const agg={cash:0,span:0,visa:0,mastercard:0};
        raw.dataRows.forEach(r=>{
          const label=(r[labelIdx]||'').toString(); const val=num(r[valueIdx]);
          const cls=classifyChannelLabel(label);
          if(cls.kind==='payment' && Object.prototype.hasOwnProperty.call(agg,cls.key)) agg[cls.key]+=val;
        });
        rw.payments = agg;
        render();
      }catch(err){ console.error(err); alert('تعذّر قراءة الملف'); }
    });
    const back=document.getElementById('rwBack2'); if(back) back.addEventListener('click', ()=>{ rw.stage=1; render(); });
    const next2=document.getElementById('rwNext2'); if(next2) next2.addEventListener('click', ()=>{ rw.stage=3; render(); });
  }

  if(rw.stage===3){
    document.querySelectorAll('[data-rowsel]').forEach(sel=>sel.addEventListener('change', ()=>{
      const row = rw.platformRows.find(r=>r.id===sel.dataset.rowsel); if(row) row.key = sel.value;
    }));
    document.querySelectorAll('[data-rowval]').forEach(inp=>inp.addEventListener('input', ()=>{
      const row = rw.platformRows.find(r=>r.id===inp.dataset.rowval); if(row) row.value = num(inp.value);
    }));
    document.querySelectorAll('[data-rowdel]').forEach(b=>b.addEventListener('click', ()=>{
      rw.platformRows = rw.platformRows.filter(r=>r.id!==b.dataset.rowdel); render();
    }));
    const addRow=document.getElementById('rwAddRowBtn'); if(addRow) addRow.addEventListener('click', ()=>{
      rw.platformRows.push({id:uid(), key:DELIVERY_PLATFORMS[0].key, label:'يدوي', value:0}); render();
    });

/* ============ RECONCILIATION KPI REPORT ============ */
function computeReconciliationKPIs(){
  const pairs = uniqueDateBranchPairs();
  const totalDays = pairs.length;
  const perSystem = INTEGRATION_SYSTEMS.map(sys=>{
    const covered = [];
    pairs.forEach(({date,branch})=>{
      const extRows = state.externalSales.filter(e=>e.date===date && e.branch===branch && e.system===sys.key);
      if(extRows.length===0) return;
      const actual = computeDayTotals(date,branch).totalSales;
      const extTotal = extRows.reduce((s,e)=> s+computeTotals(e).totalSales, 0);
      covered.push({date, branch, actual, extTotal, diff: actual-extTotal});
    });
    const coverage = totalDays ? (covered.length/totalDays*100) : 0;
    const matched = covered.filter(c=>Math.abs(c.diff)<1).length;
    const matchRate = covered.length ? (matched/covered.length*100) : 0;
    const avgDiff = covered.length ? (covered.reduce((s,c)=>s+Math.abs(c.diff),0)/covered.length) : 0;
    const connected = !!(state.integrations[sys.key] && state.integrations[sys.key].connected);
    return {sys, covered, coverage, matched, matchRate, avgDiff, connected};
  });
  return {pairs, totalDays, perSystem, totalRecords: state.externalSales.length, activeSystems: perSystem.filter(p=>p.covered.length>0).length};
}

const IMPORT_FIELD_MATCHERS = [
  {field:'date', test:h=>h.includes('date')},
  {field:'branch', test:h=>h.includes('branch')},
  {field:'shift', test:h=>h.includes('shift')},
  {field:'cashierName', test:h=>h.includes('cashier')||h.includes('cshier')},
  {field:'cash', test:h=>h.includes('cash') && !h.includes('cashier') && !h.includes('cshier') && !h.includes('mastercard')},
  {field:'span', test:h=>h.includes('span') && !h.includes('total')},
  {field:'visa', test:h=>h.includes('visa')},
  {field:'mastercard', test:h=>h.includes('master')},
  {field:'discountReturn', test:h=>h.includes('discount') || (h.includes('dis') && h.includes('return'))},
  {field:'expenses', test:h=>h.includes('expenses') && !h.includes('total') && !h.includes('إجمالي')},
  {field:'hungerstation', test:h=>h.includes('hunger')},
  {field:'toyou', test:h=>h.includes('to you')||h.includes('toyou')},
  {field:'mrsool', test:h=>h.includes('mrsool')},
  {field:'jahez', test:h=>h.includes('jahez')},
  {field:'foodzone', test:h=>h.includes('food zone')||h.includes('foodzone')},
  {field:'tekar', test:h=>h.includes('tekar')||h.includes('tekr')},
  {field:'noon', test:h=>h.includes('noon')},
  {field:'kieta', test:h=>h.includes('kieta')},
  {field:'chefz', test:h=>h.includes('chefz')||h.includes('chef')},
  {field:'ninja', test:h=>h.includes('ninja')},
];
function detectColumnMap(headerRow){
  const map = {};
  headerRow.forEach((raw, idx)=>{
    const h = (raw||'').toString().toLowerCase();
    if(!h.trim()) return;
    for(const m of IMPORT_FIELD_MATCHERS){
      if(!(m.field in map) && m.test(h)){ map[m.field] = idx; break; }
    }
  });
  return map;
}
function formatDateCell(v){
  try{
    if(v instanceof Date && !isNaN(v)){
      const y=v.getFullYear(), m=String(v.getMonth()+1).padStart(2,'0'), d=String(v.getDate()).padStart(2,'0');
      return `${y}-${m}-${d}`;
    }
    if(typeof v==='number' && window.XLSX && XLSX.SSF){
      const d = XLSX.SSF.parse_date_code(v);
      if(d && d.y) return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
    }
    if(typeof v==='string' && v.trim()){
      const s = v.trim();
      const d = new Date(s);
      if(!isNaN(d) && /\d{4}/.test(s)){
        const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0');
        return `${y}-${m}-${dd}`;
      }
    }
  }catch(e){}
  return '';
}
function parseShiftCell(v){
  const s = (v||'').toString().toLowerCase();
  if(s.includes('evening')||s.includes('مساء')) return 'evening';
  return 'morning';
}
function buildEntriesFromRows(rows){
  if(rows.length < 2) return {parsed:[], skipped:0, total:0};
  const colMap = detectColumnMap(rows[0]);
  let skipped = 0;
  const parsed = [];
  for(let i=1;i<rows.length;i++){
    const r = rows[i];
    if(!r || r.every(c=>c==='' || c===null || c===undefined)) continue;
    const dateVal = colMap.date!==undefined ? formatDateCell(r[colMap.date]) : '';
    if(!dateVal){ skipped++; continue; }
    const e = {
      date: dateVal,
      branch: colMap.branch!==undefined ? (r[colMap.branch]||'').toString().trim() : '',
      shift: colMap.shift!==undefined ? parseShiftCell(r[colMap.shift]) : 'morning',
      cashierName: colMap.cashierName!==undefined ? (r[colMap.cashierName]||'').toString().trim() : '',
    };
    ['cash','span','visa','mastercard','discountReturn','expenses'].forEach(f=>{ e[f] = colMap[f]!==undefined ? num(r[colMap[f]]) : 0; });
    DELIVERY_PLATFORMS.forEach(p=>{ e[p.key] = colMap[p.key]!==undefined ? num(r[colMap[p.key]]) : 0; });
    parsed.push(e);
  }
  return {parsed, skipped, total: rows.length-1};
}
async function parseWorkbookFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {header:1, raw:true, defval:''});
  return buildEntriesFromRows(rows);
}
function parseCSVText(text){
  const rows = []; let row=[], field='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else {
      if(c==='"') inQuotes=true;
      else if(c===','){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}
function googleSheetToCsvUrl(url){
  url = url || '';
  // If the user already published specifically as CSV (correct dropdowns chosen), Google's own link is already correct — use it as-is.
  if(/output=csv/i.test(url)) return url;
  const gidMatch = url.match(/[#&?]gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  // "Publish to web" link format: /spreadsheets/d/e/{longPubId}/pubhtml or /pub
  const pubMatch = url.match(/\/spreadsheets\/d\/e\/([a-zA-Z0-9-_]+)/);
  if(pubMatch){
    return `https://docs.google.com/spreadsheets/d/e/${pubMatch[1]}/pub?gid=${gid}&single=true&output=csv`;
  }
  // Regular share link format: /spreadsheets/d/{id}/edit
  const idMatch = url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
  if(idMatch){
    return `https://docs.google.com/spreadsheets/d/${idMatch[1]}/export?format=csv&gid=${gid}`;
  }
  return null;
}
async function fetchGoogleSheetRows(url){
  const csvUrl = googleSheetToCsvUrl(url);
  if(!csvUrl) throw new Error('رابط جوجل شيت غير صالح — الصق رابط المشاركة الكامل (يحتوي على /d/ أو /d/e/) كما يظهر في شريط العنوان أو من "نشر على الويب".');
  let resp;
  try{
    resp = await fetch(csvUrl);
  }catch(networkErr){
    throw new Error('تعذّر الاتصال بجوجل شيت (Failed to fetch) — تأكد من اتصالك بالإنترنت، وأن الشيت مُشارك كـ"أي شخص لديه الرابط" أو منشور عبر File ← Share ← Publish to web.');
  }
  if(!resp.ok) throw new Error('تعذّر الوصول للملف (رمز '+resp.status+') — تأكد أن الشيت منشور للعامة (مشاركة: أي شخص لديه الرابط، أو Publish to web).');
  const text = await resp.text();
  if(/<html/i.test(text.slice(0,200))) throw new Error('الرابط لا يعيد بيانات CSV صالحة — تأكد أنه رابط مشاركة/نشر صحيح وليس رابط تسجيل الدخول.');
  return parseCSVText(text);
}
const AUTO_SYNC_MINUTES = 10;
async function syncBranchFromSheet(branch, silent){
  const cfg = getSheetConfig(branch);
  if(!cfg || !cfg.url) return {ok:false, count:0};
  try{
    const rows = await fetchGoogleSheetRows(cfg.url);
    const {parsed} = buildEntriesFromRows(rows);
    parsed.forEach(e=>{
      if(!e.branch) e.branch = branch;
      e.id = uid(); e.system = 'google-sheet-sync'; e.autoSynced = true; e.sheetBranch = branch;
      e.createdBy = 'auto-sync'; e.createdAt = new Date().toISOString();
      if(!e.cashierName) e.cashierName = 'مزامنة جوجل شيت';
    });
    // Idempotent refresh: replace this branch's previously auto-synced records rather than duplicating.
    state.externalSales = state.externalSales.filter(e=>!(e.autoSynced && e.sheetBranch===branch)).concat(parsed);
    await sset('ns_external_sales', state.externalSales);
    state.branchSheets[branch] = {url: cfg.url, lastSync: new Date().toISOString()};
    await sset('ns_branch_sheets', state.branchSheets);
    if(!silent) await logImportOperation('sheet', 'مزامنة تلقائية: '+cfg.url, branch, parsed.length);
    return {ok:true, count:parsed.length};
  }catch(err){
    console.error('sheet sync failed for', branch, err);

async function syncAllBranchSheets(silent){
  const branches = Object.keys(state.branchSheets).filter(b=> getSheetConfig(b) && getSheetConfig(b).url);
  for(const b of branches){ await syncBranchFromSheet(b, silent); }
  return branches.length;
}

}

function attachImportEvents(){
  const btn = document.getElementById('previewImportBtn');
  btn.addEventListener('click', async ()=>{
    const fileInput = document.getElementById('imp_file');
    const file = fileInput.files[0];
    if(!file){ alert('الرجاء اختيار ملف إكسل أولاً'); return; }
    btn.textContent = 'جارِ التحليل...'; btn.disabled = true;
    try{
      const {parsed, skipped, total} = await parseWorkbookFile(file);
      const u = state.currentUser;
      const branchMode = u.role==='admin' ? document.getElementById('imp_branch').value : '__LOCK__';
      parsed.forEach(e=>{
        if(u.role!=='admin'){ e.branch = u.branch; }
        else if(branchMode!=='__FILE__'){ e.branch = branchMode; }
        else if(!e.branch){ e.branch = u.branch || state.branches[0]; }
        if(u.role==='admin' && e.branch && !state.branches.includes(e.branch)){
          state.branches.push(e.branch);
        }
        if(!e.cashierName) e.cashierName = 'غير محدد';
      });
      state.importPreview = {parsed, skipped, total, fileName:file.name};
    }catch(err){
      console.error(err);
      alert('تعذّر قراءة الملف. تأكد أنه ملف إكسل صالح (.xlsx).');
      state.importPreview = null;
    }
    btn.textContent = 'معاينة الملف'; btn.disabled = false;
    document.getElementById('importPreviewBox').innerHTML = importPreviewHtml();
    const confirmBtn = document.getElementById('confirmImportBtn');
    if(confirmBtn) confirmBtn.addEventListener('click', confirmImport);
  });
}
async function confirmImport(){
  const p = state.importPreview;
  if(!p || p.parsed.length===0) return;
  const batchId = 'imp'+Date.now();
  const u = state.currentUser;
  p.parsed.forEach(e=>{
    e.id = uid(); e.createdBy = u.username; e.createdAt = new Date().toISOString();
    e.source = 'excel-import'; e.importBatch = batchId; e.importFile = p.fileName;
    state.entries.push(e);
  });
  await sset('ns_entries', state.entries);
  if(u.role==='admin') await sset('ns_branches', state.branches);
  state.importPreview = null;
  state.view = 'report';
  render();
}
