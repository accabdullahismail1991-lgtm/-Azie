<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CFO Assistant · Restaurant Finance</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    /* Ink & Brass palette — warm charcoal ledger with brass gold, teal and rust accents */
    --bg:#13120E; --panel:#1C1A14; --panel-2:#17150F; --panel-3:#272319;
    --border:#3A3527; --border-soft:#25211A;
    --text:#F3EEE2; --text-dim:#B7AC92; --text-dimmer:#8A7F65;
    --accent:#C9A227; --accent-strong:#A8850F; --accent-soft:rgba(201,162,39,.15); --accent-ink:#171410;
    --good:#4FA88A; --good-text:#63C79E;
    --bad:#C1503F; --bad-text:#E1795F;
    --warn:#D9A441; --warn-text:#E8BE6E;
    --radius:12px;
    --font-en: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-ar: "Tahoma", "Segoe UI", "Noto Kufi Arabic", "Geeza Pro", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-en);}
  body[data-lang="ar"]{font-family:var(--font-ar);}
  a{color:inherit;text-decoration:none;}
  button,select,input{font-family:inherit;}
  .ltr-num{unicode-bidi:isolate;direction:ltr;font-family:var(--mono);font-variant-numeric:tabular-nums;}

  .app{display:flex;min-height:100vh;width:100%;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:270px; flex-shrink:0; background:var(--panel-2);
    border-inline-end:1px solid var(--border-soft);
    display:flex; flex-direction:column;
    position:fixed; inset-inline-start:0; top:0; bottom:0; z-index:30;
    transform:translateX(-102%); transition:transform .2s ease;
  }
  html[dir="rtl"] .sidebar{transform:translateX(102%);}
  .sidebar.open{transform:translateX(0);}
  @media(min-width:1024px){ .sidebar{position:static; transform:none !important;} }
  .sidebar-head{height:64px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--border-soft);}
  .logo{height:32px;width:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-strong));
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;color:var(--accent-ink);}
  .brand-name{font-size:13.5px;font-weight:600;line-height:1.2;}
  .brand-sub{font-size:10.5px;color:var(--text-dimmer);line-height:1.3;}
  .sidebar-close{margin-inline-start:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;display:none;}
  @media(max-width:1023px){.sidebar-close{display:block;}}

  .nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;}
  .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-dimmer);padding:12px 10px 4px;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:start;
    padding:9px 11px;border-radius:9px;border:1px solid transparent;background:none;
    color:var(--text-dim);font-size:12.8px;cursor:pointer;line-height:1.35;
  }
  .nav-btn:hover{background:var(--panel-3);color:var(--text);}
  .nav-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(201,162,39,.3);}
  .nav-btn svg{flex-shrink:0;width:15px;height:15px;}

  .sidebar-foot{padding:14px;border-top:1px solid var(--border-soft);}
  .std-box{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:10px 12px;}
  .std-label{font-size:11px;color:var(--text-dim);}
  .std-value{font-size:12.5px;font-weight:500;margin-top:2px;}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;}
  .overlay.show{display:block;}
  @media(min-width:1024px){.overlay{display:none !important;}}

  /* ---------- Main ---------- */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  @media(min-width:1024px){.main{margin-inline-start:270px;}}

  header.topbar{
    height:64px;border-bottom:1px solid var(--border-soft);background:rgba(19,18,14,.95);
    backdrop-filter:blur(6px); display:flex;align-items:center;gap:10px;
    padding:0 16px; position:sticky; top:0; z-index:10;
  }
  .icon-btn{height:34px;width:34px;border-radius:9px;border:1px solid var(--border);background:var(--panel);
    color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;}
  .icon-btn:hover{color:var(--text);}
  .menu-toggle{display:flex;}
  @media(min-width:1024px){.menu-toggle{display:none;}}
  .crumb{font-size:13px;color:var(--text-dimmer);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:767px){.crumb{display:none;}}
  .spacer{flex:1;}

  .select-wrap{position:relative;}
  select.field{
    appearance:none;background:var(--panel);border:1px solid var(--border);border-radius:9px;
    padding:8px 30px 8px 12px; font-size:12.5px;color:var(--text);cursor:pointer;max-width:190px;
  }
  html[dir="rtl"] select.field{padding:8px 12px 8px 30px;}
  .select-wrap svg{position:absolute;inset-inline-end:9px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text-dimmer);width:13px;height:13px;}
  .field-range{display:none;}
  @media(min-width:640px){.field-range{display:block;}}

  .badge-dot{position:absolute;top:-3px;inset-inline-end:-3px;height:16px;min-width:16px;padding:0 3px;border-radius:999px;
    background:var(--bad);font-size:9.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center;}

  .lang-toggle{display:flex;border:1px solid var(--border);border-radius:9px;overflow:hidden;}
  .lang-toggle button{padding:7px 11px;font-size:11.5px;font-weight:700;background:var(--panel);color:var(--text-dimmer);border:none;cursor:pointer;}
  .lang-toggle button.active{background:var(--accent);color:var(--accent-ink);}

  .btn-brass{display:flex;align-items:center;gap:6px;height:34px;border-radius:9px;background:var(--accent);
    border:none;color:var(--accent-ink);padding:0 14px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .btn-brass:hover{background:var(--accent-strong);}
  .btn-ghost{display:flex;align-items:center;gap:6px;height:34px;border-radius:9px;background:var(--panel);
    border:1px solid var(--border);color:var(--text-dim);padding:0 14px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .btn-ghost:hover{color:var(--text);border-color:var(--text-dimmer);}
  @media(max-width:639px){.export-btn span{display:none;}}

  main.content{flex:1;padding:20px 16px 40px;}
  @media(min-width:1024px){main.content{padding:24px;}}
  .page-title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .page-title{font-size:18px;font-weight:600;margin:0;}
  .page-sub{font-size:12.5px;color:var(--text-dimmer);margin:2px 0 0;}

  .tab-section{display:none;}
  .tab-section.active{display:block;}

  /* ---------- Cards / grid ---------- */
  .grid{display:grid;gap:16px;}
  .grid-kpi{grid-template-columns:repeat(1,1fr);}
  @media(min-width:640px){.grid-kpi{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1200px){.grid-kpi{grid-template-columns:repeat(5,1fr);}}
  .grid-kpi3{grid-template-columns:repeat(1,1fr);}
  @media(min-width:768px){.grid-kpi3{grid-template-columns:repeat(3,1fr);}}
  .grid-kpi4{grid-template-columns:repeat(1,1fr);}
  @media(min-width:640px){.grid-kpi4{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1024px){.grid-kpi4{grid-template-columns:repeat(4,1fr);}}
  .grid-2col{grid-template-columns:1fr;}
  @media(min-width:1200px){.grid-2col{grid-template-columns:2fr 1fr;}}
  .grid-chart2{grid-template-columns:1fr;}
  @media(min-width:1024px){.grid-chart2{grid-template-columns:1fr 1fr;}}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .card-soft{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:14px;}

  .kpi{position:relative;border-radius:var(--radius);border:1px solid var(--border);background:var(--panel);
    padding:16px;display:flex;flex-direction:column;gap:10px;}
  .kpi.alert{border-color:rgba(193,80,63,.45);background:rgba(193,80,63,.06);}
  .kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-dim);font-weight:500;}
  .kpi-value-row{display:flex;align-items:baseline;gap:5px;}
  .kpi-value{font-size:24px;font-weight:600;}
  .kpi-suffix{font-size:13px;color:var(--text-dim);}
  .kpi-bottom{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-dimmer);}
  .ping{position:absolute;top:12px;inset-inline-end:12px;height:8px;width:8px;border-radius:50%;background:var(--bad);}

  .trend{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:600;}
  .trend.up{color:var(--good-text);} .trend.down{color:var(--bad-text);}

  .pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:500;border:1px solid;white-space:nowrap;}
  .pill-neutral{background:var(--panel-3);color:var(--text-dim);border-color:var(--border);}
  .pill-good{background:rgba(79,168,138,.12);color:var(--good-text);border-color:rgba(79,168,138,.32);}
  .pill-bad{background:rgba(193,80,63,.12);color:var(--bad-text);border-color:rgba(193,80,63,.32);}
  .pill-warn{background:rgba(217,164,65,.12);color:var(--warn-text);border-color:rgba(217,164,65,.32);}

  /* ---------- Insights panel ---------- */
  .insights-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .insights-icon{height:32px;width:32px;border-radius:9px;background:var(--accent-soft);border:1px solid rgba(201,162,39,.3);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .insight-item{border:1px solid var(--border);background:var(--panel-2);border-radius:9px;padding:14px;margin-bottom:10px;}
  .insight-item:last-child{margin-bottom:0;}
  .insight-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .insight-left{display:flex;align-items:flex-start;gap:9px;}
  .insight-title-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .insight-title{font-size:13.5px;font-weight:500;}
  .insight-body{font-size:12.5px;color:var(--text-dim);margin:6px 0 0;line-height:1.55;}
  .insight-action{font-size:12px;color:var(--accent);margin-top:6px;}
  .approve-btn{flex-shrink:0;font-size:12px;font-weight:700;border-radius:8px;padding:7px 13px;border:1px solid var(--accent);
    background:var(--accent);color:var(--accent-ink);cursor:pointer;white-space:nowrap;}
  .approve-btn.applied{background:rgba(79,168,138,.15);border-color:rgba(79,168,138,.4);color:var(--good-text);}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:560px;}
  thead tr{border-bottom:1px solid var(--border);}
  th{text-align:start;font-size:11px;font-weight:500;color:var(--text-dimmer);padding-bottom:8px;padding-inline-end:14px;}
  th.num, td.num{text-align:end;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(39,35,25,.5);}
  td{padding:9px 0;padding-inline-end:14px;font-size:13px;}
  .section-row td{padding-top:16px;padding-bottom:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--text-dimmer);cursor:pointer;user-select:none;}
  .section-row .chev{display:inline-block;transition:transform .15s;margin-inline-end:5px;}
  .section-row.collapsed .chev{transform:rotate(-90deg);}
  html[dir="rtl"] .section-row.collapsed .chev{transform:rotate(90deg);}
  tr.pnl-child{display:table-row;}
  tr.pnl-child.hidden{display:none;}
  .row-strong td{font-weight:600;background:rgba(39,35,25,.45);}
  .ebitda-row td{border-top:2px solid rgba(201,162,39,.35);padding-top:12px;font-weight:700;font-size:13.5px;}

  /* ---------- Charts ---------- */
  .chart-box{height:190px;position:relative;}
  .chart-box.tall{height:240px;}
  .chart-title{font-size:11px;font-weight:500;color:var(--text-dim);margin-bottom:8px;}

  .legend-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .legend-item{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--text-dim);}
  .legend-item .dot{display:inline-block;height:8px;width:8px;border-radius:50%;margin-inline-end:6px;}
  .legend-name{display:flex;align-items:center;}

  .rule-item{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--border);background:var(--panel-2);
    border-radius:9px;padding:13px;margin-bottom:10px;}
  .rule-item:last-child{margin-bottom:0;}
  .rule-name{font-size:13px;font-weight:500;}
  .rule-detail{font-size:12px;color:var(--text-dim);margin-top:3px;line-height:1.5;}

  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .card-title{font-size:14px;font-weight:600;}
  .card-desc{font-size:11px;color:var(--text-dim);margin-top:2px;}

  .stack{display:flex;flex-direction:column;gap:20px;}

  /* ---------- Upload tab ---------- */
  .template-card{border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:16px;}
  .template-head{display:flex;align-items:center;justify-content:between;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
  .template-title{font-size:13.5px;font-weight:600;}
  .template-desc{font-size:12px;color:var(--text-dim);margin:2px 0 12px;line-height:1.5;}
  .template-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .file-btn{position:relative;overflow:hidden;display:inline-flex;}
  .file-btn input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;}
  .status-msg{font-size:12px;margin-top:10px;padding:9px 12px;border-radius:8px;border:1px solid;}
  .status-ok{background:rgba(79,168,138,.1);border-color:rgba(79,168,138,.3);color:var(--good-text);}
  .status-err{background:rgba(193,80,63,.1);border-color:rgba(193,80,63,.3);color:var(--bad-text);}
  .cols-hint{font-size:11px;color:var(--text-dimmer);margin-top:8px;line-height:1.6;word-break:break-word;}
  .cols-hint code{background:var(--panel-3);padding:1px 5px;border-radius:4px;font-family:var(--mono);color:var(--text-dim);}

  /* ---------- Manual tab ---------- */
  .manual-section{border-bottom:1px solid var(--border-soft);padding:16px 0;}
  .manual-section:first-child{padding-top:0;}
  .manual-section:last-child{border-bottom:none;padding-bottom:0;}
  .manual-num{display:inline-flex;align-items:center;justify-content:center;height:22px;width:22px;border-radius:6px;
    background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:700;margin-inline-end:8px;}
  .manual-title{font-size:14px;font-weight:600;display:flex;align-items:center;}
  .manual-body{font-size:12.8px;color:var(--text-dim);line-height:1.7;margin-top:8px;}
  .manual-body ul{margin:6px 0;padding-inline-start:20px;}
  .manual-body li{margin-bottom:4px;}
  .swatch-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
  .swatch{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-dim);background:var(--panel-2);
    border:1px solid var(--border);border-radius:8px;padding:6px 10px;}
  .swatch .dot{height:12px;width:12px;border-radius:4px;flex-shrink:0;}

  /* ---------- Analytics tab ---------- */
  .heatmap-wrap{overflow-x:auto;}
  .heatmap{display:grid;gap:3px;min-width:640px;}
  .heatmap-hourlabel, .heatmap-daylabel{font-size:9.5px;color:var(--text-dimmer);display:flex;align-items:center;justify-content:center;}
  .heatmap-cell{border-radius:4px;aspect-ratio:1;min-height:18px;cursor:default;}
  .analytics-legend{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--text-dimmer);}
  .analytics-legend .grad{height:8px;width:120px;border-radius:4px;background:linear-gradient(90deg,rgba(201,162,39,.08),#C9A227);}
  .forecast-note{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--text-dimmer);margin-top:8px;}
  .forecast-note .dash{width:14px;height:0;border-top:1.5px dashed var(--text-dimmer);}

  /* ---------- Master data ---------- */
  .pill-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;}
  .pill-tab{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;}
  .pill-tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
  .template-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dimmer);margin:4px 0 -4px;}

  /* ---------- Smart Assistant chat widget ---------- */
  .chat-fab{position:fixed;inset-inline-end:22px;bottom:22px;z-index:40;height:52px;width:52px;border-radius:50%;
    background:var(--accent);border:none;color:var(--accent-ink);display:flex;align-items:center;justify-content:center;
    cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.4);}
  .chat-fab:hover{background:var(--accent-strong);}
  .chat-fab .dot-new{position:absolute;top:-2px;inset-inline-end:-2px;height:12px;width:12px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);}
  .chat-panel{position:fixed;inset-inline-end:22px;bottom:86px;z-index:40;width:360px;max-width:92vw;height:500px;max-height:75vh;
    background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.5);
    display:none;flex-direction:column;overflow:hidden;}
  .chat-panel.open{display:flex;}
  .chat-header{padding:14px 16px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:9px;background:var(--panel-2);}
  .chat-header-icon{height:28px;width:28px;border-radius:8px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .chat-header-title{font-size:13px;font-weight:600;}
  .chat-header-sub{font-size:10.5px;color:var(--text-dimmer);}
  .chat-close{margin-inline-start:auto;background:none;border:none;color:var(--text-dim);cursor:pointer;}
  .chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .chat-msg{max-width:86%;font-size:12.5px;line-height:1.55;padding:9px 12px;border-radius:10px;white-space:pre-wrap;}
  .chat-msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px;}
  html[dir="rtl"] .chat-msg.user{border-bottom-right-radius:10px;border-bottom-left-radius:3px;}
  .chat-msg.bot{align-self:flex-start;background:var(--panel-3);color:var(--text);border-bottom-left-radius:3px;}
  html[dir="rtl"] .chat-msg.bot{border-bottom-left-radius:10px;border-bottom-right-radius:3px;}
  .chat-msg.typing{color:var(--text-dimmer);font-style:italic;}
  .chat-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;}
  .chat-chip{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel-2);
    color:var(--text-dim);cursor:pointer;}
  .chat-chip:hover{color:var(--text);border-color:var(--text-dimmer);}
  .chat-input-row{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border-soft);background:var(--panel-2);}
  .chat-input{flex:1;resize:none;background:var(--panel);border:1px solid var(--border);border-radius:9px;color:var(--text);
    padding:9px 11px;font-size:12.5px;font-family:inherit;height:38px;max-height:80px;}
  .chat-input:focus{outline:none;border-color:var(--accent);}
  .chat-send{height:38px;width:38px;border-radius:9px;background:var(--accent);border:none;color:var(--accent-ink);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .chat-send:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body data-lang="en">
<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo">₪</div>
      <div>
        <div class="brand-name" data-i18n="appName">CFO Assistant</div>
        <div class="brand-sub" data-i18n="appTagline">Multi-branch F&amp;B finance</div>

/* ============================================================
   HELPERS
============================================================ */
const t = (key) => I18N[LANG][key] ?? key;
function branchName(id){
  if(id === "all") return t("consolidated");
  if(DYNAMIC_BRANCH_NAMES[id]) return DYNAMIC_BRANCH_NAMES[id];
  return (I18N[LANG].branches[id]) || id;
}

function fmtNum(n, compact=false){
  const sign = n < 0 ? "-" : "";
  const abs = Math.abs(Math.round(n));
  if(compact && abs >= 1000){
    const val = abs / 1000;
    return sign + val.toFixed(abs >= 100000 ? 0 : 1) + "K";
  }
  return sign + abs.toLocaleString("en-US");
}
function pctStr(n, d=1){ return n.toFixed(d) + "%"; }
function numSpan(text){ return '<span class="ltr-num">'+text+'</span>'; }

function trendHtml(value, suffix){
  const up = value >= 0;
  const arrow = up
    ? '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>'
    : '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="7" x2="17" y2="17"/><polyline points="17 7 17 17 7 17"/></svg>';
  return `<span class="trend ${up?'up':'down'}">${arrow}${numSpan(Math.abs(value).toFixed(1)+(suffix||' pts'))}</span>`;
}
function pillHtml(tone, text){ return `<span class="pill pill-${tone}">${text}</span>`; }

function kpiCard({label, value, suffix, deltaPts, benchmark, alert, suffixPct}){
  return `
  <div class="kpi ${alert?'alert':''}">
    ${alert?'<span class="ping"></span>':''}
    <div class="kpi-label">${label}</div>
    <div class="kpi-value-row">
      <span class="kpi-value">${numSpan(value)}</span>
      ${suffix?`<span class="kpi-suffix">${suffix}</span>`:''}
    </div>
    <div class="kpi-bottom">
      <span>${deltaPts!==undefined ? trendHtml(deltaPts, suffixPct?'%':undefined) : ''}</span>
      <span>${benchmark}</span>
    </div>
  </div>`;
}
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
const sumField = (arr, f) => arr.reduce((a,r)=>a+r[f],0);

function renderNav(){
  const el = document.getElementById("navList");
  let html = ""; let lastGroup = null;
  NAV.forEach(n=>{
    if(n.group !== lastGroup){ html += `<div class="nav-group-label">${t(n.group)}</div>`; lastGroup = n.group; }
    html += `<button class="nav-btn ${TAB===n.id?'active':''}" data-tab="${n.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n.icon]}</svg>
      <span>${t(n.key)}</span></button>`;
  });
  el.innerHTML = html;
  el.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      TAB = btn.dataset.tab;
      document.getElementById("sidebar").classList.remove("open");
      document.getElementById("overlay").classList.remove("show");
      renderAll();
    });
  });
}

function renderSelects(){
  const bSel = document.getElementById("branchSelect");
  bSel.innerHTML = BRANCH_IDS.map(id => `<option value="${id}">${branchName(id)}</option>`).join("");
  bSel.value = BRANCH_IDS.includes(BRANCH) ? BRANCH : "all";

/* ============================================================
   TAB: FINANCIAL STATEMENTS (P&L)
============================================================ */
function pnlRowHtml(labelHtml, actual, budget, strong){
  const variance = budget===0 ? 0 : ((actual-budget)/budget)*100;
  const varColor = Math.abs(variance) < 0.05 ? "var(--text-dim)" : (actual>budget ? "var(--bad-text)" : "var(--good-text)");
  return `<tr class="pnl-child ${strong?'row-strong':''}">
    <td>${labelHtml}</td><td class="num">${numSpan(fmtNum(actual))}</td>
    <td class="num" style="color:var(--text-dim)">${numSpan(fmtNum(budget))}</td>
    <td class="num" style="color:${varColor}">${numSpan((variance>=0?'+':'')+variance.toFixed(1)+'%')}</td></tr>`;
}
function pnlSectionHtml(sectionKey, titleKey, rows, totalLabel, isRevenue){
  const actualTotal = sumField(rows, "actual"), budgetTotal = sumField(rows, "budget");
  const open = sectionOpen[sectionKey];
  const rowsHtml = rows.map(r=>{
    const label = isRevenue ? t(r.key) : r[LANG];
    const v = r.budget===0?0:((r.actual-r.budget)/r.budget)*100;
    const c = Math.abs(v)<0.05?"var(--text-dim)":(r.actual>r.budget?"var(--bad-text)":"var(--good-text)");
    return `<tr class="pnl-child section-${sectionKey} ${open?'':'hidden'}">
      <td style="padding-inline-start:22px;color:var(--text-dim);">${label}</td>
      <td class="num">${numSpan(fmtNum(r.actual))}</td>
      <td class="num" style="color:var(--text-dim)">${numSpan(fmtNum(r.budget))}</td>
      <td class="num"><span style="color:${c}">${numSpan((v>=0?'+':'')+v.toFixed(1)+'%')}</span></td></tr>`;
  }).join("");
  const tv = budgetTotal===0?0:((actualTotal-budgetTotal)/budgetTotal)*100;
  const tc = Math.abs(tv)<0.05?"var(--text-dim)":(actualTotal>budgetTotal?"var(--bad-text)":"var(--good-text)");
  const totalRow = `<tr class="pnl-child section-${sectionKey} ${open?'':'hidden'} row-strong">
    <td>${totalLabel}</td><td class="num">${numSpan(fmtNum(actualTotal))}</td>
    <td class="num" style="color:var(--text-dim)">${numSpan(fmtNum(budgetTotal))}</td>
    <td class="num"><span style="color:${tc}">${numSpan((tv>=0?'+':'')+tv.toFixed(1)+'%')}</span></td></tr>`;
  return `<tr class="section-row ${open?'':'collapsed'}" data-section="${sectionKey}"><td colspan="4"><span class="chev">▾</span>${t(titleKey)}</td></tr>${rowsHtml}${totalRow}`;
}
function renderPnlTab(){
  const revTotal = sumField(pnl.revenue,"actual"), revBudget = sumField(pnl.revenue,"budget");
  const cosTotal = sumField(pnl.cos,"actual"), cosBudget = sumField(pnl.cos,"budget");
  const grossActual = revTotal - cosTotal, grossBudget = revBudget - cosBudget;
  const ctrlTotal = sumField(pnl.controllable,"actual"), ctrlBudget = sumField(pnl.controllable,"budget");
  const primeActual = cosTotal + ctrlTotal, primeBudget = cosBudget + ctrlBudget;
  const occActual = sumField(pnl.occupancy,"actual"), occBudget = sumField(pnl.occupancy,"budget");
  const ebitdaActual = grossActual - ctrlTotal - occActual, ebitdaBudget = grossBudget - ctrlBudget - occBudget;
  const ebVar = ebitdaBudget ? ((ebitdaActual-ebitdaBudget)/ebitdaBudget)*100 : 0;

  document.getElementById("tab-pnl").innerHTML = `
    <div class="card">
      <div class="card-head">
        <div><div class="card-title">${t("pnlTitle")}</div><div class="card-desc">${t("pnlSub")}</div></div>
        ${pillHtml("neutral", t("actualVsBudget"))}
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>${t("colLineItem")}</th><th class="num">${t("colActual")}</th><th class="num">${t("colBudget")}</th><th class="num">${t("colVariance")}</th></tr></thead>
        <tbody>
          ${pnlSectionHtml("revenue","secRevenue",pnl.revenue,t("totalRevenue"),true)}
          ${pnlSectionHtml("cos","secCos",pnl.cos,t("totalCos"),false)}
          ${pnlRowHtml(t("grossProfit"), grossActual, grossBudget, true)}
          ${pnlSectionHtml("labor","secLabor",pnl.controllable,t("totalLabor"),false)}
          ${pnlRowHtml(t("primeCostRow"), primeActual, primeBudget, true)}
          ${pnlSectionHtml("occupancy","secOccupancy",pnl.occupancy,t("totalOccupancy"),false)}
          <tr class="pnl-child ebitda-row">
            <td>${t("storeEbitda")}</td>
            <td class="num" style="color:var(--good-text)">${numSpan(fmtNum(ebitdaActual))}</td>
            <td class="num" style="color:var(--text-dim)">${numSpan(fmtNum(ebitdaBudget))}</td>
            <td class="num" style="color:var(--good-text)">${numSpan(ebVar.toFixed(1)+'%')}</td>
          </tr>
        </tbody>
      </table></div>
    </div>`;
  document.querySelectorAll(".section-row").forEach(row=>{
    row.addEventListener("click", ()=>{ sectionOpen[row.dataset.section] = !sectionOpen[row.dataset.section]; renderPnlTab(); });
  });
}

/* ============================================================
   DYNAMIC AI INSIGHTS — computed from whatever data is loaded now
============================================================ */
function generateInsights(){
  const list = []; let idc = 1;

  branchMatrix.forEach(b=>{
    if(b.prime > 60){
      list.push({id:idc++, severity:"critical",
        en:{title:`Prime Cost breach — ${branchName(b.id)}`, body:`Prime cost is running at ${b.prime.toFixed(1)}%, above the 60% ceiling, compressing store-level margin.`, action:`Audit food waste and overtime scheduling at ${branchName(b.id)}.`},
        ar:{title:`تجاوز التكلفة الأساسية — ${branchName(b.id)}`, body:`التكلفة الأساسية عند ${b.prime.toFixed(1)}% متجاوزة سقف 60%، ما يضغط على هامش الربح.`, action:`مراجعة هدر الأغذية وجدولة الوقت الإضافي في ${branchName(b.id)}.`}});
    }
  });
  branchMatrix.forEach(b=>{
    if(b.variance < -3){
      list.push({id:idc++, severity:"warning",
        en:{title:`${branchName(b.id)} trailing budget`, body:`Net sales are ${Math.abs(b.variance).toFixed(1)}% below budget this period.`, action:`Review local demand drivers and the promotional calendar for ${branchName(b.id)}.`},
        ar:{title:`${branchName(b.id)} أقل من الموازنة`, body:`صافي المبيعات أقل من الموازنة بنسبة ${Math.abs(b.variance).toFixed(1)}% هذه الفترة.`, action:`مراجعة محركات الطلب المحلية وجدول العروض في ${branchName(b.id)}.`}});
    }
  });
  if(branchMatrix.length){
    const best = branchMatrix.reduce((a,b)=> b.ebitda>a.ebitda?b:a, branchMatrix[0]);
    list.push({id:idc++, severity:"positive",
      en:{title:`${branchName(best.id)} leading on EBITDA`, body:`EBITDA margin of ${best.ebitda.toFixed(1)}% is the strongest in the portfolio this period.`, action:`Document staffing and menu-mix practices at ${branchName(best.id)} as a playbook for other branches.`},
      ar:{title:`${branchName(best.id)} الأعلى في هامش الأرباح`, body:`هامش الأرباح ${best.ebitda.toFixed(1)}% هو الأفضل ضمن المحفظة هذه الفترة.`, action:`توثيق ممارسات التوظيف ومزيج القائمة في ${branchName(best.id)} كنموذج للفروع الأخرى.`}});
  }
  aggregatorData.forEach(a=>{
    if(a.commissionPct >= 24){
      list.push({id:idc++, severity:"warning",
        en:{title:`${a.name} commission drag`, body:`${a.name} commission take is ${a.commissionPct}% of GMV, compressing delivery-channel margin.`, action:`Renegotiate tier pricing or shift promo budget toward lower-commission platforms.`},
        ar:{title:`عبء عمولة ${a.name}`, body:`عمولة ${a.name} تبلغ ${a.commissionPct}% من إجمالي المبيعات، ما يضغط على هامش قناة التوصيل.`, action:`إعادة التفاوض على شرائح العمولة أو تحويل ميزانية العروض إلى منصات أقل عمولة.`}});
    }
  });
  const totalWastePct = sumField(wasteData,"pctOfCogs");
  if(wasteData.length && totalWastePct > 6){
    const top = wasteData.reduce((a,b)=> b.value>a.value?b:a, wasteData[0]);
    list.push({id:idc++, severity:"warning",
      en:{title:"Waste above healthy range", body:`Total waste is ${totalWastePct.toFixed(1)}% of COGS, led by ${top.en} at ${fmtNum(top.value)} SAR.`, action:"Tighten par-stock levels and review receiving/prep procedures for the top category."},
      ar:{title:"الهدر أعلى من النطاق الصحي", body:`إجمالي الهدر ${totalWastePct.toFixed(1)}% من تكلفة البضاعة، بقيادة ${top.ar} بقيمة ${fmtNum(top.value)} ريال.`, action:"تشديد حدود المخزون ومراجعة إجراءات الاستلام والتحضير للفئة الأعلى."}});
  }
  const opA=sumField(cashFlow.operating,"actual"), invA=sumField(cashFlow.investing,"actual"), finA=sumField(cashFlow.financing,"actual");
  if(opA+invA+finA < 0){
    list.push({id:idc++, severity:"critical",
      en:{title:"Negative net cash flow", body:`Net change in cash is ${fmtNum(opA+invA+finA)} SAR this period, driven by financing and investing outflows.`, action:"Review capex timing and the distribution schedule against operating cash generation."},
      ar:{title:"تدفق نقدي صافٍ سلبي", body:`صافي التغير في النقدية ${fmtNum(opA+invA+finA)} ريال هذه الفترة، بسبب التدفقات الخارجة الاستثمارية والتمويلية.`, action:"مراجعة توقيت المصاريف الرأسمالية وجدول التوزيعات مقابل النقد التشغيلي المتولد."}});
  }
  const li = monthlyTrend.ebitdaActual.length-1;
  if(li>=0 && monthlyTrend.ebitdaActual[li] < monthlyTrend.ebitdaBudget[li]){
    list.push({id:idc++, severity:"warning",
      en:{title:`${monthlyTrend.months[li]} EBITDA below budget`, body:`EBITDA margin came in at ${monthlyTrend.ebitdaActual[li].toFixed(1)}% vs. a ${monthlyTrend.ebitdaBudget[li].toFixed(1)}% budget.`, action:"Compare cost structure against prior months to isolate the driver."},
      ar:{title:`هامش أرباح ${monthlyTrend.months[li]} أقل من الموازنة`, body:`بلغ هامش الأرباح ${monthlyTrend.ebitdaActual[li].toFixed(1)}% مقابل موازنة ${monthlyTrend.ebitdaBudget[li].toFixed(1)}%.`, action:"مقارنة هيكل التكاليف بالأشهر السابقة لتحديد السبب."}});
  }
  if(staffData.length){
    const rows = staffData.map(s=>({name:staffDisplayName(s), splh: s.laborHours? staffSales(s)/s.laborHours:0}));
    const avg = rows.reduce((a,r)=>a+r.splh,0)/rows.length;
    const worst = rows.reduce((a,b)=> b.splh<a.splh?b:a, rows[0]);
    if(avg>0 && worst.splh < avg*0.85){
      list.push({id:idc++, severity:"warning",
        en:{title:`${worst.name} productivity lagging`, body:`Sales per labor hour is ${fmtNum(worst.splh)} SAR, below the ${fmtNum(avg)} SAR portfolio average.`, action:"Review shift scheduling and staffing levels against the sales curve."},
        ar:{title:`تراجع إنتاجية ${worst.name}`, body:`المبيعات لكل ساعة عمل ${fmtNum(worst.splh)} ريال، أقل من متوسط المحفظة البالغ ${fmtNum(avg)} ريال.`, action:"مراجعة جدولة الورديات ومستويات التوظيف مقابل منحنى المبيعات."}});
    }
  }

  const order = {critical:0, warning:1, positive:2};
  list.sort((a,b)=>order[a.severity]-order[b.severity]);
  return list.slice(0,6);
}

function linearForecast(values, stepsAhead){
  const n = values.length;
  const xs = values.map((_,i)=>i);
  const meanX = xs.reduce((a,b)=>a+b,0)/n;
  const meanY = values.reduce((a,b)=>a+b,0)/n;
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-meanX)*(values[i]-meanY); den += (xs[i]-meanX)**2; }
  const slope = den? num/den : 0;
  const intercept = meanY - slope*meanX;
  const out = [];
  for(let s=1; s<=stepsAhead; s++){ out.push(slope*(n-1+s)+intercept); }
  return out;
}

function csvEscape(v){
  const s = String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadBlob(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function downloadTemplateCSV(id){
  const tpl = TEMPLATES[id];
  const aoa = [tpl.columns, ...tpl.sample];
  const csv = aoa.map(row=>row.map(csvEscape).join(",")).join("\r\n");
  downloadBlob(id+"_template.csv", "\uFEFF"+csv, "text/csv;charset=utf-8;");
}
function downloadTemplateXLSX(id){
  const tpl = TEMPLATES[id];
  const aoa = [tpl.columns, ...tpl.sample];
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Template");
  XLSX.writeFile(wb, id+"_template.xlsx");
}

function parseUploadedFile(file, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(sheet, {defval:""});
      cb(null, rows);
    }catch(err){ cb(err); }
  };
  reader.onerror = ()=>cb(new Error("read error"));
  reader.readAsArrayBuffer(file);
}

function validateRows(id, rows){
  const tpl = TEMPLATES[id];
  if(!rows || rows.length===0) return {ok:false, msg:t("emptyFile")};
  const firstKeys = Object.keys(rows[0]).map(k=>k.trim().toLowerCase());
  const missing = tpl.required.filter(c=>!firstKeys.includes(c));
  if(missing.length) return {ok:false, msg:t("missingCols")+" "+missing.join(", ")};
  return {ok:true};
}
function num(v, fallback=0){ const n = parseFloat(v); return isNaN(n) ? fallback : n; }
function getCell(row, key){
  const foundKey = Object.keys(row).find(k=>k.trim().toLowerCase()===key);
  return foundKey ? row[foundKey] : "";
}

function applyPnlUpload(rows){
  const newIds = ["all"]; const newNames = {}; const newKpis = {}; const newRevBreak = {}; const newMatrix = [];
  let revAct=[0,0,0], cosAct=[0,0,0], laborAct=[0,0,0], occAct=[0,0,0];
  let cosBudgetAgg=0, laborBudgetAgg=0, revBudgetAgg=0, cosActualAgg=0, laborActualAgg=0, revActualAgg=0;

  rows.forEach((row,idx)=>{
    const id = "u"+idx;
    const name = String(getCell(row,"branch_name")||("Branch "+(idx+1)));
    const dineIn = num(getCell(row,"dine_in_revenue")), takeaway = num(getCell(row,"takeaway_revenue")), agg = num(getCell(row,"aggregator_revenue"));
    const netSales = dineIn+takeaway+agg;
    const lastYear = num(getCell(row,"last_year_sales"), netSales*0.92);
    const food = num(getCell(row,"food_cost")), bev = num(getCell(row,"beverage_cost")), pack = num(getCell(row,"packaging_cost"));
    const cosTotal = food+bev+pack;
    const directLabor = num(getCell(row,"direct_labor")), kitchenWages = num(getCell(row,"kitchen_wages")), mgmt = num(getCell(row,"management_allocation"));
    const laborTotal = directLabor+kitchenWages+mgmt;
    const rent = num(getCell(row,"rent")), util = num(getCell(row,"utilities")), maint = num(getCell(row,"maintenance"));
    const occTotal = rent+util+maint;
    const budgetNetSales = num(getCell(row,"budget_net_sales"), netSales);
    const budgetCogsPct = num(getCell(row,"budget_cogs_pct"), 30);
    const budgetLaborPct = num(getCell(row,"budget_labor_pct"), 25);
    const cogsPct = netSales? cosTotal/netSales*100 : 0;
    const laborPct = netSales? laborTotal/netSales*100 : 0;
    const ebitda = netSales? ((netSales-cosTotal-laborTotal-occTotal)/netSales*100) : 0;
    const variance = budgetNetSales? ((netSales-budgetNetSales)/budgetNetSales*100) : 0;

    newIds.push(id); newNames[id] = name;
    newKpis[id] = {netSales, netSalesLY:lastYear, cogs:cogsPct, cogsB:budgetCogsPct, labor:laborPct, laborB:budgetLaborPct, ebitda, ebitdaB:16};
    newRevBreak[id] = [dineIn, takeaway, agg];
    newMatrix.push({id, ebitda, prime:cogsPct+laborPct, aggCommission:num(getCell(row,"aggregator_commission_pct"),6.5), sales:netSales, variance});

    revAct[0]+=dineIn; revAct[1]+=takeaway; revAct[2]+=agg; revActualAgg+=netSales; revBudgetAgg+=budgetNetSales;
    cosAct[0]+=food; cosAct[1]+=bev; cosAct[2]+=pack; cosActualAgg+=cosTotal; cosBudgetAgg += budgetNetSales*budgetCogsPct/100;
    laborAct[0]+=directLabor; laborAct[1]+=kitchenWages; laborAct[2]+=mgmt; laborActualAgg+=laborTotal; laborBudgetAgg += budgetNetSales*budgetLaborPct/100;
    occAct[0]+=rent; occAct[1]+=util; occAct[2]+=maint;
  });

  const totalNet = Object.values(newKpis).reduce((a,k)=>a+k.netSales,0);
  const totalNetLY = Object.values(newKpis).reduce((a,k)=>a+k.netSalesLY,0);
  const totalCos = cosAct[0]+cosAct[1]+cosAct[2], totalLabor = laborAct[0]+laborAct[1]+laborAct[2], totalOcc = occAct[0]+occAct[1]+occAct[2];
  newKpis.all = { netSales:totalNet, netSalesLY:totalNetLY,
    cogs: totalNet? totalCos/totalNet*100:0, cogsB:30, labor: totalNet? totalLabor/totalNet*100:0, laborB:25,
    ebitda: totalNet? ((totalNet-totalCos-totalLabor-totalOcc)/totalNet*100):0, ebitdaB:16 };
  newRevBreak.all = [revAct[0],revAct[1],revAct[2]];

  const scaleCos = cosActualAgg? cosBudgetAgg/cosActualAgg : 1;
  const scaleLabor = laborActualAgg? laborBudgetAgg/laborActualAgg : 1;
  const scaleRev = revActualAgg? revBudgetAgg/revActualAgg : 1;

  pnl.revenue[0].actual = revAct[0]; pnl.revenue[0].budget = revAct[0]*scaleRev;
  pnl.revenue[1].actual = revAct[1]; pnl.revenue[1].budget = revAct[1]*scaleRev;
  pnl.revenue[2].actual = revAct[2]; pnl.revenue[2].budget = revAct[2]*scaleRev;
  pnl.cos[0].actual = cosAct[0]; pnl.cos[0].budget = cosAct[0]*scaleCos;
  pnl.cos[1].actual = cosAct[1]; pnl.cos[1].budget = cosAct[1]*scaleCos;
  pnl.cos[2].actual = cosAct[2]; pnl.cos[2].budget = cosAct[2]*scaleCos;
  pnl.controllable[0].actual = laborAct[0]; pnl.controllable[0].budget = laborAct[0]*scaleLabor;
  pnl.controllable[1].actual = laborAct[1]; pnl.controllable[1].budget = laborAct[1]*scaleLabor;
  pnl.controllable[2].actual = laborAct[2]; pnl.controllable[2].budget = laborAct[2]*scaleLabor;
  pnl.occupancy[0].actual = occAct[0]; pnl.occupancy[0].budget = occAct[0];
  pnl.occupancy[1].actual = occAct[1]; pnl.occupancy[1].budget = occAct[1];
  pnl.occupancy[2].actual = occAct[2]; pnl.occupancy[2].budget = occAct[2];

  BRANCH_IDS = newIds; DYNAMIC_BRANCH_NAMES = newNames; branchKpis = newKpis; revenueBreakdown = newRevBreak; branchMatrix = newMatrix;
  BRANCH = "all";
}

}

    branch:String(getCell(row,"branch_name")||""), price:num(getCell(row,"price")), foodCost:num(getCell(row,"food_cost")),
    units:num(getCell(row,"monthly_units_sold")) }));
}
function applyEmployeesUpload(rows){
  employeesData = rows.map(row=>({ name:String(getCell(row,"employee_name")||"Employee"), branch:String(getCell(row,"branch_name")||""),
    role:String(getCell(row,"role")||""), hireDate:String(getCell(row,"hire_date")||""), wage:num(getCell(row,"hourly_wage")),
    monthlyHours:num(getCell(row,"monthly_hours")) }));
}
function applySuppliersUpload(rows){
  suppliersData = rows.map(row=>({ name:String(getCell(row,"supplier_name")||"Supplier"), category:String(getCell(row,"category")||""),
    monthlySpend:num(getCell(row,"monthly_spend")), leadTime:num(getCell(row,"lead_time_days")), contact:String(getCell(row,"contact")||"") }));
}
function applyBranchInfoUpload(rows){
  branchInfoData = rows.map(row=>({ branch:String(getCell(row,"branch_name")||"Branch"), address:String(getCell(row,"address")||""),
    size:num(getCell(row,"size_sqm")), seating:num(getCell(row,"seating_capacity")), openingDate:String(getCell(row,"opening_date")||""),
    manager:String(getCell(row,"manager_name")||"") }));
}

const APPLIERS = {
  pnl:applyPnlUpload, cashflow:applyCashflowUpload, trend:applyTrendUpload, waste:applyWasteUpload, staff:applyStaffUpload,
  menu:applyMenuUpload, employees:applyEmployeesUpload, suppliers:applySuppliersUpload, branchInfo:applyBranchInfoUpload,
};

function resetTemplate(id){
  if(id==="pnl"){
    BRANCH_IDS = JSON.parse(JSON.stringify(DEFAULTS.BRANCH_IDS));
    DYNAMIC_BRANCH_NAMES = JSON.parse(JSON.stringify(DEFAULTS.DYNAMIC_BRANCH_NAMES));
    branchKpis = JSON.parse(JSON.stringify(DEFAULTS.branchKpis));
    revenueBreakdown = JSON.parse(JSON.stringify(DEFAULTS.revenueBreakdown));
    branchMatrix = JSON.parse(JSON.stringify(DEFAULTS.branchMatrix));
    pnl = JSON.parse(JSON.stringify(DEFAULTS.pnl));
    BRANCH = "all";
  } else if(id==="cashflow"){ cashFlow = JSON.parse(JSON.stringify(DEFAULTS.cashFlow)); }
  else if(id==="trend"){ monthlyTrend = JSON.parse(JSON.stringify(DEFAULTS.monthlyTrend)); }
  else if(id==="waste"){ wasteData = JSON.parse(JSON.stringify(DEFAULTS.wasteData)); }
  else if(id==="staff"){ staffData = JSON.parse(JSON.stringify(DEFAULTS.staffData)); }
  else if(id==="menu"){ menuData = JSON.parse(JSON.stringify(DEFAULTS.menuData)); }
  else if(id==="employees"){ employeesData = JSON.parse(JSON.stringify(DEFAULTS.employeesData)); }
  else if(id==="suppliers"){ suppliersData = JSON.parse(JSON.stringify(DEFAULTS.suppliersData)); }
  else if(id==="branchInfo"){ branchInfoData = JSON.parse(JSON.stringify(DEFAULTS.branchInfoData)); }
  delete uploadStatus[id];
  renderAll();
}

function handleUploadInput(id, input){
  const file = input.files[0];
  if(!file) return;
  parseUploadedFile(file, (err, rows)=>{
    if(err){ uploadStatus[id] = {ok:false, msg:t("uploadError")+" "+err.message}; renderUploadTab(); return; }
    const v = validateRows(id, rows);
    if(!v.ok){ uploadStatus[id] = {ok:false, msg:v.msg}; renderUploadTab(); return; }
    try{
      APPLIERS[id](rows);
      uploadStatus[id] = {ok:true, msg:rows.length+" "+t("uploadSuccess")};
      renderAll();
    }catch(e){ uploadStatus[id] = {ok:false, msg:t("uploadError")+" "+e.message}; renderUploadTab(); }
    input.value = "";
  });
}

/* ============================================================
   SMART ASSISTANT — Claude-powered chat grounded in current dashboard data
============================================================ */
let chatOpen = false;
let chatLoading = false;
let chatHistory = [];   // full display history, may include the canned greeting
let apiHistory = [];    // only real turns sent to the model as context

function buildDashboardContext(){
  const k = branchKpis[BRANCH] || branchKpis.all;
  const opA=sumField(cashFlow.operating,"actual"), invA=sumField(cashFlow.investing,"actual"), finA=sumField(cashFlow.financing,"actual");
  return JSON.stringify({
    selectedBranch: branchName(BRANCH),
    period: t("ranges")[RANGE_IDX],
    kpis: { netSalesSAR:Math.round(k.netSales), cogsPct:+k.cogs.toFixed(1), laborPct:+k.labor.toFixed(1),
      primeCostPct:+(k.cogs+k.labor).toFixed(1), ebitdaMarginPct:+k.ebitda.toFixed(1) },
    branches: branchMatrix.map(b=>({ name:branchName(b.id), salesSAR:Math.round(b.sales), ebitdaPct:+b.ebitda.toFixed(1),
      primeCostPct:+b.prime.toFixed(1), vsBudgetPct:+b.variance.toFixed(1), aggCommissionPct:b.aggCommission })),
    topInsights: generateInsights().map(i=>({severity:i.severity, title:i[LANG].title})),
    wasteTotalSAR: Math.round(sumField(wasteData,"value")), wastePctOfCogs: +sumField(wasteData,"pctOfCogs").toFixed(1),
    cashFlowNetSAR: Math.round(opA+invA+finA),
    ytdSalesActualSAR: Math.round(sumField(monthlyTrend.salesActual.map(v=>({actual:v})),"actual")),
    ytdSalesBudgetSAR: Math.round(sumField(monthlyTrend.salesBudget.map(v=>({actual:v})),"actual")),
    aggregators: aggregatorData.map(a=>({name:a.name, commissionPct:a.commissionPct, gmvSAR:a.gmv})),
  });
}

function scrollChatToBottom(){
  const el = document.getElementById("chatMessages");
  if(el) el.scrollTop = el.scrollHeight;
}

function renderChatMessages(){
  const el = document.getElementById("chatMessages");
  if(!el) return;
  el.innerHTML = chatHistory.map(m=>`<div class="chat-msg ${m.role==='user'?'user':'bot'}">${escapeHtml(m.content)}</div>`).join("")
    + (chatLoading ? `<div class="chat-msg bot typing">${t("chatTyping")}</div>` : "");
  scrollChatToBottom();
}
function escapeHtml(s){ const d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

function renderChatChips(){
  const el = document.getElementById("chatChips");
  if(!el) return;
  if(apiHistory.length>0){ el.innerHTML=""; return; }
  const chips = [t("chatChip1"), t("chatChip2"), t("chatChip3"), t("chatChip4")];
  el.innerHTML = chips.map(c=>`<button class="chat-chip">${c}</button>`).join("");
  el.querySelectorAll(".chat-chip").forEach(btn=>{
    btn.addEventListener("click", ()=> sendChatMessage(btn.textContent));
  });
}

function addUserMessage(text){ chatHistory.push({role:"user", content:text}); apiHistory.push({role:"user", content:text}); }
function addBotMessage(text, real=true){ chatHistory.push({role:"assistant", content:text}); if(real) apiHistory.push({role:"assistant", content:text}); }

async function sendChatMessage(text){
  text = (text||"").trim();
  if(!text || chatLoading) return;
  addUserMessage(text);
  renderChatChips();
  renderChatMessages();
  chatLoading = true;
  renderChatMessages();

  const sysEn = "You are a restaurant-industry CFO analyst embedded in a financial dashboard. Answer the user's question using ONLY the JSON data snapshot below; if the data does not contain what is needed, say so plainly rather than guessing or inventing numbers. Be concise (2-5 sentences unless a short list is clearer), always express currency in SAR, and speak like a helpful, direct finance analyst. Respond in English.";
  const sysAr = "أنت محلل مالي (مساعد مدير مالي) لسلسلة مطاعم، مدمج داخل لوحة تحكم مالية. أجب عن سؤال المستخدم بالاعتماد فقط على بيانات JSON أدناه؛ إذا لم تحتوِ البيانات على ما يلزم فقل ذلك بوضوح بدل التخمين أو اختلاق أرقام. كن مختصرًا (من 2 إلى 5 جمل، إلا إذا كانت قائمة قصيرة أوضح)، واستخدم دائمًا الريال السعودي كعملة، وتحدث كمحلل مالي مباشر ومفيد. أجب باللغة العربية.";
  const system = (LANG==="ar" ? sysAr : sysEn) + "\n\nData snapshot (JSON):\n" + buildDashboardContext();

  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        model:"claude-sonnet-4-6",
        max_tokens:1000,
        system: system,
        messages: apiHistory,
      }),
    });
    const data = await res.json();
    const parts = (data && data.content ? data.content : []).filter(c=>c.type==="text").map(c=>c.text);
    const reply = parts.join("\n").trim();
    chatLoading = false;
    addBotMessage(reply || t("chatNoResponse"));
  }catch(e){
    chatLoading = false;
    addBotMessage(t("chatError"), false);
  }
  renderChatMessages();
}

function openChatPanel(){
  chatOpen = true;
  document.getElementById("chatPanel").classList.add("open");
  document.getElementById("chatFabDot").style.display = "none";
  if(chatHistory.length===0){ addBotMessage(t("chatGreeting"), false); renderChatMessages(); }
  renderChatChips();
}
function closeChatPanel(){ chatOpen = false; document.getElementById("chatPanel").classList.remove("open"); }

document.getElementById("chatFab").addEventListener("click", ()=>{ chatOpen ? closeChatPanel() : openChatPanel(); });
document.getElementById("chatClose").addEventListener("click", closeChatPanel);
document.getElementById("chatSend").addEventListener("click", ()=>{
  const inp = document.getElementById("chatInput");
  sendChatMessage(inp.value);
  inp.value = "";
});
document.getElementById("chatInput").addEventListener("keydown", (e)=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    const inp = document.getElementById("chatInput");
    sendChatMessage(inp.value);
    inp.value = "";
  }
});

renderAll();
</script>
</body>
</html>
