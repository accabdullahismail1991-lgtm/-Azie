<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — المنصة الموحدة</title>
<link rel="stylesheet" href="/assets/theme.css">
<style>
.login-wrap{
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-card{
  width:100%; max-width:400px;
  background:linear-gradient(180deg, var(--card), rgba(20,28,46,.6));
  border:1px solid var(--border); border-radius:18px; padding:36px 32px;
  box-shadow:0 20px 50px -20px rgba(0,0,0,.6);
}
.login-brand{display:flex; align-items:center; gap:14px; margin-bottom:28px;}
.login-brand h1{font-size:18px; font-weight:800;}
.login-brand span{font-size:12px; color:var(--muted);}
.field{margin-bottom:18px;}
.field label{display:block; font-size:13px; font-weight:700; margin-bottom:8px; color:var(--muted);}
.field input{
  width:100%; padding:12px 14px; border-radius:10px;
  background:rgba(255,255,255,.04); border:1px solid var(--border);
  color:var(--text); font-family:inherit; font-size:14px;
}
.field input:focus{outline:none; border-color:var(--gold);}
.login-btn{width:100%; justify-content:center; padding:12px; font-size:14.5px; margin-top:6px;}
.error-box{
  background:rgba(184,67,58,.12); border:1px solid rgba(184,67,58,.4);
  color:#ffb4ac; padding:10px 14px; border-radius:10px; font-size:13px;
  margin-bottom:18px; display:none;
}
.error-box.show{display:block;}
</style>
</head>
<body>

<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="login-brand">
      <div class="brand-mark">M</div>
      <div class="brand-text">
        <h1>المنصة الموحدة</h1>
        <span>تسجيل الدخول للمتابعة</span>
      </div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <div class="field">
      <label for="username">اسم المستخدم</label>
      <input id="username" name="username" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>

    <button type="submit" class="btn btn-gold login-btn" id="submitBtn">دخول</button>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const errorBox = document.getElementById('errorBox');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.textContent = 'جارٍ الدخول...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value,
        password: document.getElementById('password').value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'تعذر تسجيل الدخول');
    window.location.href = '/';
  } catch (err) {
    errorBox.textContent = err.message;
    errorBox.classList.add('show');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'دخول';
  }
});
</script>

</body>
</html>
